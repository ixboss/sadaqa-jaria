name: Build Android APK & iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

# أَوقف أي تشغيل قديم لنفس الـ workflow على نفس المرجع
concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # لا تفعّل cache: 'npm' — package-lock.json محجوب في .gitignore
          # لأن التطبيق ثابت بدون build step، والـ cache يتطلب وجود الـ lockfile.

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Prepare web assets (www/)
        run: node scripts/prepare-www.mjs

      - name: Verify www/ contents
        run: |
          test -f www/index.html || { echo "::error::www/index.html missing after prepare-www"; exit 1; }
          for f in app.js features.js config.js surah-meta.js backup.js mushaf.js pageflip.js sw.js manifest.json; do
            test -f "www/$f" || { echo "::error::www/$f missing after prepare-www"; exit 1; }
          done
          echo "www/ verified:"
          find www -type f | sort | sed 's/^/  /'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Add Capacitor Android platform
        run: npx cap add android || npx cap sync android

      - name: Sync Capacitor (android)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/*.apk artifacts/sadaqa-jaria-debug.apk || true
          cp android/app/build/outputs/apk/release/*.apk artifacts/sadaqa-jaria-release.apk || true
          ls -la artifacts/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sadaqa-jaria-android-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: build-ios
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # لا تفعّل cache: 'npm' — package-lock.json محجوب في .gitignore
          # لأن التطبيق ثابت بدون build step، والـ cache يتطلب وجود الـ lockfile.

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Prepare web assets (www/)
        run: node scripts/prepare-www.mjs

      - name: Verify www/ contents
        run: |
          test -f www/index.html || { echo "::error::www/index.html missing after prepare-www"; exit 1; }
          for f in app.js features.js config.js surah-meta.js backup.js mushaf.js pageflip.js sw.js manifest.json; do
            test -f "www/$f" || { echo "::error::www/$f missing after prepare-www"; exit 1; }
          done

      - name: Add Capacitor iOS platform
        run: npx cap add ios || npx cap sync ios

      - name: Sync Capacitor (ios)
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.3.app || true

      - name: Build unsigned IPA
        run: |
          set -e
          SCHEME="App"
          PROJECT="ios/App/App.xcodeproj"
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ExportOptions"
          PAYLOAD_PATH="$RUNNER_TEMP/Payload"

          echo "::group::xcodebuild archive"
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive \
            | tee "$RUNNER_TEMP/archive.log"
          echo "::endgroup::"

          # بدل تصدير xcodebuild الذي يتطلب ملف توقيع، نبني الـ IPA يدوياً
          # من الـ .app داخل الأرشيف (غير موقّع — للتوزيع اليدوي/الاختبار).
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in $ARCHIVE_PATH/Products/Applications"
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"

          rm -rf "$PAYLOAD_PATH" "$EXPORT_PATH"
          mkdir -p "$PAYLOAD_PATH"
          cp -R "$APP_PATH" "$PAYLOAD_PATH/"
          mkdir -p artifacts
          ipa_name="sadaqa-jaria-unsigned.ipa"
          # zip من داخل مجلد Payload ليكون هيكل الـ IPA صحيحاً (Payload/App.app)
          ( cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/artifacts/$ipa_name" "Payload" )
          echo "Built $ipa_name"

      - name: Verify IPA
        run: |
          ls -la artifacts/
          unzip -l artifacts/sadaqa-jaria-unsigned.ipa | head -20

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadaqa-jaria-ios-ipa
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 30
