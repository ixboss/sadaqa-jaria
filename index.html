// رمز طلب لتفادي سباق التبديل السريع بين السور (يُلغي الرسم إن تغيّرت السورة أثناء التحميل)
let openSurahToken = 0;

window.openSurah = async function(number) {
  const token = ++openSurahToken;
  state.currentSurah = allSurahs.find(s => s.number === number) || { name: `سورة ${number}`, number: number, numberOfAyahs: 0 };
  showScreen('surah-view', 'slide-left');
  const container = document.getElementById('verses-container'); container.innerHTML = getSkeletonHTML();
  document.getElementById('surah-view-name').textContent = state.currentSurah.name; updateBookmarkIcon();
  if (window.AudioPlayer) AudioPlayer.bindSurahHeader();

  let surahData = null;
  try {
    // TTL: 7 أيام للنسخة المخزّنة
    const cached = localStorage.getItem(`q_s_u_${number}`);
    if (cached) {
      const parsed = JSON.parse(cached);
      const age = Date.now() - (parsed._ts || 0);
      if (age < 7 * 24 * 60 * 60 * 1000) surahData = parsed.data;
      else localStorage.removeItem(`q_s_u_${number}`);
    }
    if (!surahData) {
      const res = await fetch(`https://api.alquran.cloud/v1/surah/${number}/quran-uthmani`);
      surahData = (await res.json()).data;
      localStorage.setItem(`q_s_u_${number}`, JSON.stringify({ data: surahData, _ts: Date.now() }));
    }

    if(state.currentSurah.numberOfAyahs && surahData.ayahs && surahData.ayahs.length !== state.currentSurah.numberOfAyahs) {
        localStorage.removeItem(`q_s_u_${number}`);
        throw new Error("بيانات غير مطابقة");
    }

  } catch(e) {
    // لا تعرض خطأً قديماً إذا كان المستخدم قد انتقل لسورة أخرى
    if (token !== openSurahToken) return;
    container.innerHTML = `<div style="text-align:center; padding:20px;">خطأ في التحميل. تأكد من الإنترنت.<br><button class="btn-scale" style="margin-top:15px; width:auto; padding:10px 20px;" onclick="openSurah(${number})">إعادة المحاولة 🔄</button></div>`;
    return;
  }

  // ألغِ الرسم إذا بدّل المستخدم السورة أثناء التحميل
  if (token !== openSurahToken) return;

  let html = (number !== 1 && number !== 9) ? `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>` : '';
  html += `<div class="mushaf-block">`;
  surahData.ayahs.forEach(ayah => {
    let text = ayah.text;
    if (ayah.numberInSurah === 1 && number !== 1 && number !== 9) {
        text = stripBismillah(text);
    }
    html += `${text} <span class="ayah-separator">﴿${toArabicNum(ayah.numberInSurah)}﴾</span> `;
  });
  html += `</div>`; container.innerHTML = html;
}

function updateKhatmahUI() {
  if (!state.khatmah || !state.khatmah.active) {
    document.getElementById('khatmah-setup').style.display = 'block'; document.getElementById('khatmah-dash').style.display = 'none';
  } else {
    document.getElementById('khatmah-setup').style.display = 'none'; document.getElementById('khatmah-dash').style.display = 'block';
    const start = state.khatmah.todayWirdStart; const end = state.khatmah.todayWirdEnd;
    document.getElementById('kd-start-badge').textContent = toArabicNum(start);
    document.getElementById('kd-end-badge').textContent = toArabicNum(end);
    // أظهر طريقة الختمة (عدد الأيام إن اختيرت) ليعكس الورد الصحيح
    const startLabel = document.querySelector('#kd-start-badge');
    if (startLabel && state.khatmah.totalDays) {
      startLabel.parentElement.parentElement.title = `ختمة في ${toArabicNum(state.khatmah.totalDays)} يوم — ${toArabicNum(state.khatmah.pagesPerDay)} صفحة يومياً`;
    }
    document.getElementById('kd-last').textContent = toArabicNum(state.khatmah.lastPageRead || start - 1);

    const progPct = Math.min(Math.round(((state.khatmah.lastPageRead || 0) / 604) * 100), 100);
    document.getElementById('kd-prog-txt').textContent = `${toArabicNum(progPct)}%`;
    document.getElementById('kd-prog-circle').style.strokeDasharray = `${progPct}, 100`;

    const ring = document.getElementById('khatmah-ring');
    if(progPct === 100) ring.classList.add('pulse-success'); else ring.classList.remove('pulse-success');

    const isDoneToday = (state.khatmah.lastPageRead >= end);
    const dashInfo = document.querySelector('.k-dash-info'); let msg = document.getElementById('k-done-msg');

    if (isDoneToday) {
        if (!msg) {
            msg = document.createElement('div'); msg.id = 'k-done-msg';
            msg.style = 'margin-top:12px; color:var(--success); font-weight:bold; font-size:calc(var(--font-size) * 0.5); text-align:center; background:rgba(76,175,125,0.1); padding:8px; border-radius:6px; border: 1px dashed var(--success);';
            msg.textContent = '🎉 لقد أتممت ورد اليوم بنجاح!'; dashInfo.appendChild(msg);
        }
    } else if (msg) { msg.remove(); }

    const resumeBtn = document.querySelector('#khatmah-dash button[onclick="openKhatmahReader()"]');
    if (resumeBtn) { resumeBtn.innerHTML = isDoneToday ? 'قراءة المزيد (إضافي) 📖' : 'متابعة القراءة 📖'; }
  }
}

window.startKhatmah = function() {
  let val = parseInt(document.getElementById('k-val').value, 10); if (isNaN(val) || val <= 0) val = 20;
  let startPage = parseInt(document.getElementById('k-start').value, 10) || 1;
  const method = (document.getElementById('k-method') || {}).value || 'pages';
  let pagesPerDay = val;
  let totalDays = null;
  // طريقة "بعدد الأيام": احسب عدد الصفحات اليومية من عدد الأيام المتبقية
  if (method === 'days') {
    totalDays = val;
    const remaining = Math.max(1, 604 - startPage + 1);
    pagesPerDay = Math.max(1, Math.ceil(remaining / totalDays));
  }
  state.khatmah = { active: true, method, totalDays, pagesPerDay, currentPage: startPage, todayWirdStart: startPage, todayWirdEnd: Math.min(startPage + pagesPerDay - 1, 604), lastPageRead: startPage > 1 ? startPage - 1 : 0, lastActiveDate: getLocalToday() };
  saveState(); updateKhatmahUI();
}
window.resetKhatmah = async function() {
  const confirmed = await window.showAppDialog('هل تريد بالفعل إنشاء ختمة جديدة وإلغاء الختمة الحالية؟', true);
  if(confirmed) { state.khatmah = null; saveState(); updateKhatmahUI(); }

// معالجة الأيام الفائتة: إذا فات المستخدم يوم أو أكثر، يُعاد جدولة الورد
function checkMissedDays() {
  if (!state.khatmah || !state.khatmah.active) return;
  const last = state.khatmah.lastActiveDate;
  if (!last || last === getLocalToday()) return;
  // أعد الجدولة من حيث توقف
  const cont = Math.max(state.khatmah.lastPageRead + 1, state.khatmah.todayWirdStart);
  state.khatmah.todayWirdStart = Math.min(cont, 604);
  state.khatmah.todayWirdEnd = Math.min(state.khatmah.todayWirdStart + state.khatmah.pagesPerDay - 1, 604);
  state.khatmah.currentPage = state.khatmah.todayWirdStart;
  state.khatmah.lastActiveDate = getLocalToday();
  saveState();
}

async function loadKhatmahPage(pageNum) {
  const container = document.getElementById('khatmah-page-container');
  container.innerHTML = getSkeletonHTML();
  // إعادة إظهار شريط التحكم عند فتح صفحة جديدة (المستخدم في وضع القراءة)
  document.getElementById('khatmah-controls').classList.remove('controls-hidden');

  document.getElementById('kp-prev').disabled = (pageNum <= 1);
  document.getElementById('kp-next').disabled = (pageNum >= 604);

  const doneBtn = document.getElementById('kp-done');
  if (pageNum >= state.khatmah.todayWirdEnd) {
      doneBtn.innerHTML = '✓ إتمام وحفظ الورد'; doneBtn.style.background = 'var(--accent-deep)'; doneBtn.style.borderColor = 'var(--accent-deep)'; doneBtn.style.color = '#f4f1e8';
  } else {
      doneBtn.innerHTML = '✓ إنهاء الورد'; doneBtn.style.background = ''; doneBtn.style.borderColor = ''; doneBtn.style.color = '';
  }

  updateHeaderSubtitle();

  try {
    const res = await fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-uthmani`);
    const data = await res.json();

    let html = `<div style="text-align:center; font-size:calc(var(--font-size) * 0.54); color:var(--text-dim); margin-bottom:10px;">صفحة ${toArabicNum(pageNum)}</div>`;
    let currentSurah = data.data.ayahs[0].surah.number;

    if (data.data.ayahs[0].numberInSurah === 1) {
        html += `<div class="surah-header-card" style="margin-top:20px;"><div class="surah-h-name">${data.data.ayahs[0].surah.name}</div></div>`;
        if (currentSurah !== 1 && currentSurah !== 9) html += `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
    }
    html += `<div class="mushaf-block">`;

    data.data.ayahs.forEach((ayah, index) => {
      if (ayah.surah.number !== currentSurah) {
        html += `</div>`;
        html += `<div class="surah-header-card" style="margin-top:20px;"><div class="surah-h-name">${ayah.surah.name}</div></div>`;
        if (ayah.surah.number !== 1 && ayah.surah.number !== 9) html += `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
        html += `<div class="mushaf-block">`; currentSurah = ayah.surah.number;
      }

      let text = ayah.text;
      if (ayah.numberInSurah === 1 && ayah.surah.number !== 1 && ayah.surah.number !== 9) {
          text = stripBismillah(text);
      }
      html += `${text} <span class="ayah-separator">﴿${toArabicNum(ayah.numberInSurah)}﴾</span> `;
      if (index === data.data.ayahs.length - 1) html += `</div>`;
    });

    container.innerHTML = html; document.getElementById('content').scrollTop = 0;
    state.khatmah.lastPageRead = pageNum; saveState(); updateKhatmahUI();

    if (pageNum < 604) setTimeout(() => fetch(`https://api.alquran.cloud/v1/page/${pageNum + 1}/quran-uthmani`).catch(() => {}), 800);
  } catch(e) {
    container.innerHTML = `<div style="text-align:center; padding:40px;">خطأ اتصال. تأكد من الإنترنت وحاول مرة أخرى.<br><button class="btn-scale" style="margin-top:15px; width:auto; padding:10px 20px;" onclick="loadKhatmahPage(${pageNum})">إعادة المحاولة 🔄</button></div>`;
  }
}

window.completeWird = async function() {
  const nx = Math.max(state.khatmah.todayWirdEnd, state.khatmah.lastPageRead) + 1;
  // تسجيل القراءة في الإحصائيات
  if (window.StatsManager) {
    const pagesRead = Math.max(1, (state.khatmah.lastPageRead || nx - 1) - (state.khatmah.todayWirdStart || nx - 1) + 1);
    StatsManager.recordRead(pagesRead);
  }
  if (nx > 604) {
      window.Celebrate ? Celebrate(null, { confetti: 120, burst: 0, ring: false }) : Motion.confetti(120);
      await new Promise(r => setTimeout(r, 300));
      await window.showAppDialog('مبارك عليك ختم القرآن الكريم! 🤲<br><span style="font-size:calc(var(--font-size) * 0.54); font-weight:normal; color:var(--text-dim)">تقبل الله منك صالح الأعمال.</span>', false);
      state.khatmah = null; saveState(); navigateBack();
  } else {
      // احتفال صغير بإتمام الورد
      if (window.Celebrate) Celebrate(null, { confetti: 30, burst: 0, ring: false, haptic: true });
      await new Promise(r => setTimeout(r, 100));
      state.khatmah.currentPage = nx; state.khatmah.todayWirdStart = nx; state.khatmah.todayWirdEnd = Math.min(nx + state.khatmah.pagesPerDay - 1, 604);
      state.khatmah.lastPageRead = nx - 1; state.khatmah.lastActiveDate = getLocalToday(); saveState(); navigateBack();
  }
}

function getLocalToday() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// التقدم اليومي للأذكار — ملفوف بـ try/catch (وضع التصفح الخاص يعطّل localStorage)
function getProg(c, i) { try { return parseInt(localStorage.getItem(`ath_${getLocalToday()}_${c}_${i}`) || '0', 10); } catch (e) { return 0; } }
function setProg(c, i, v) { try { localStorage.setItem(`ath_${getLocalToday()}_${c}_${i}`, v); } catch (e) {} }

function renderAthkarList() {
  document.getElementById('athkar-grid').innerHTML = ATHKAR.map((cat, ci) => {
    const totalTapsRequired = cat.items.reduce((sum, item) => sum + item.count, 0);
    const totalTapsDone = cat.items.reduce((sum, item, ii) => sum + Math.min(getProg(ci, ii), item.count), 0);
    const pct = totalTapsRequired > 0 ? Math.round((totalTapsDone / totalTapsRequired) * 100) : 0;

    const doneCount = cat.items.filter((_, ii) => getProg(ci, ii) >= cat.items[ii].count).length;

    return `<div class="athkar-cat-card ${pct === 100 ? 'completed' : ''}" data-magnetic onclick="openCategory(${ci})">
      <div class="circle-wrap" style="width:40px;height:40px;"><svg viewBox="0 0 36 36" class="circular-chart"><path class="circle-bg" stroke-width="4" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" /><path class="circle-path" stroke-width="4" stroke-dasharray="${pct}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" /></svg></div>
      <div class="cat-info"><div class="cat-name">${cat.name}</div><div style="font-size:calc(var(--font-size) * 0.45);color:var(--text-dim)">${toArabicNum(doneCount)}/${toArabicNum(cat.items.length)}</div></div>
    </div>`;
  }).join('');
  Motion.staggerIn(document.getElementById('athkar-grid'));
}

window.openCategory = function(ci) {
  state.currentCatIndex = ci; showScreen('thikr-view', 'slide-left');
  document.getElementById('thikr-list-container').innerHTML = ATHKAR[ci].items.map((item, i) => {
    const done = getProg(ci, i) >= item.count;
    return `<div class="thikr-card" data-magnetic><button class="copy-btn" data-copy-from=".thikr-text" aria-label="نسخ الذكر" title="نسخ"><span aria-hidden="true">⧉</span> نسخ</button><div class="thikr-text">${item.text}</div><button class="thikr-tap-btn ${done ? 'done' : ''}" onclick="tapThikr(${ci}, ${i}, this)">${done ? '✓ اكتمل' : `<span class="count-anim">${toArabicNum(getProg(ci,i))}</span> / ${toArabicNum(item.count)}`}</button></div>`;
  }).join('');
  Motion.staggerIn(document.getElementById('thikr-list-container'));
}

window.tapThikr = function(ci, i, btn) {
  const max = ATHKAR[ci].items[i].count; let curr = getProg(ci, i); if (curr >= max) return; curr++; setProg(ci, i, curr);
  if (curr >= max) {
    btn.classList.add('done');
    btn.textContent = '✓ اكتمل';
    if (window.Celebrate) Celebrate(btn, { confetti: 0, burst: 10, ring: true, haptic: true });
    if (window.StatsManager) StatsManager.recordAthkarDay();
    Motion.floater(btn, '✓', 'var(--success)');
    if (window.AccessibilityHelper) AccessibilityHelper.announceMessage('اكتمل هذا الذكر');
  } else {
        btn.innerHTML = `<span class="count-anim">${toArabicNum(curr)}</span> / ${toArabicNum(max)}`;
    // Re-trigger pop on the count
    const counter = btn.querySelector('.count-anim');
    if (counter) { counter.classList.remove('pop'); void counter.offsetWidth; counter.classList.add('pop'); }
    Motion.floater(btn, '+1', 'var(--accent)');
  }
  // Tap pulse on the button
  btn.classList.remove('tap-pulse'); void btn.offsetWidth; btn.classList.add('tap-pulse');
}

let tasbihCount = parseInt(localStorage.getItem('tasbihCount') || '0', 10);
let tasbihLap = parseInt(localStorage.getItem('tasbihLap') || '0', 10);

function tasbihTarget() { return (window.Settings ? Settings.getTasbihTarget() : 33) || 33; }
// الجولات: ٣ جولات لكل هدف (دائماً ٣ للتجربة التقليدية)
function tasbihTotalLaps() { return 3; }

window.rebuildTasbih = function() {
  tasbihCount = 0; tasbihLap = 0;
  document.getElementById('tasbih-msg').classList.remove('active');
  // أعد بناء الخرزات حسب الهدف
  const wrap = document.getElementById('tasbih-circle-wrap');
  wrap.querySelectorAll('.tasbih-bead').forEach(b => b.remove());
  const t = tasbihTarget();
  const beads = Math.min(t, 99);
  for (let i = 0; i < beads; i++) {
    const angle = (i / beads) * 2 * Math.PI - Math.PI / 2;
    const bead = document.createElement('div'); bead.className = 'tasbih-bead';
    bead.style.left = `${50 + 47 * Math.cos(angle)}%`; bead.style.top = `${50 + 47 * Math.sin(angle)}%`; wrap.appendChild(bead);
  }
  // أعد بناء نقاط الجولات
  const lapsWrap = document.getElementById('tasbih-laps');
  lapsWrap.innerHTML = '';
  for (let i = 0; i < tasbihTotalLaps(); i++) lapsWrap.appendChild(Object.assign(document.createElement('div'), { className: 'tasbih-lap-dot' }));
  updateTasbihUI();
};

function buildTasbih() {
  const wrap = document.getElementById('tasbih-circle-wrap');
  if(wrap.querySelectorAll('.tasbih-bead').length === 0) {
    window.rebuildTasbih();
  }
}

let _tasbihDisplayedCount = 0;
let _tasbihAnnounceTimer = null;
function updateTasbihUI() {
  const numEl = document.getElementById('tasbih-count-num');
  // Smooth count up to new value
  if (_tasbihDisplayedCount !== tasbihCount) {
    Motion.animateNumber(numEl, _tasbihDisplayedCount, tasbihCount, 280);
    _tasbihDisplayedCount = tasbihCount;
  }
  // أعلن القيمة لقارئ الشاشة (polite) ولكن مع debouncing لتجنّب الإزعاج عند كل ضغطة
  numEl.setAttribute('aria-live', 'polite');
  clearTimeout(_tasbihAnnounceTimer);
  _tasbihAnnounceTimer = setTimeout(() => {
    numEl.textContent = toArabicNum(tasbihCount);
  }, 400);
  document.querySelectorAll('.tasbih-lap-dot').forEach((dot, i) => {
    const wasFilled = dot.classList.contains('filled');
    const shouldFill = i < tasbihLap;
    if (wasFilled !== shouldFill) {
      dot.classList.toggle('filled', shouldFill);
      if (shouldFill) { dot.classList.remove('pop'); void dot.offsetWidth; dot.classList.add('pop'); }
    }
  });
  // تنفّس هادئ عندما يكون العدد صفراً (يدعو للضغط)
  const tapBtn = document.getElementById('tasbih-tap-btn');
  tapBtn.classList.toggle('breathe', tasbihCount === 0 && !prefersReducedMotion);
  // الحلقة تمثل تقدماً نسبياً نحو الهدف (خرزات أقل من الهدف)، فيُملأ كل خرزة بنسبة تقدمه
  const goal = tasbihTarget();
  const beadsList = document.querySelectorAll('.tasbih-bead');
  const filledBeads = goal > beadsList.length ? Math.floor((tasbihCount / goal) * beadsList.length) : tasbihCount;
  beadsList.forEach((b, i) => b.classList.toggle('filled', i < filledBeads));
  localStorage.setItem('tasbihCount', tasbihCount);
  localStorage.setItem('tasbihLap', tasbihLap);
}

document.getElementById('tasbih-tap-btn').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  document.getElementById('tasbih-msg').classList.remove('active');
  tasbihCount++;
  // اهتزاز لمسي خفيف عند كل تسبيحة
  if (window.Haptics) Haptics.tap(10);
  // Animate the bead that just got filled (نفس النسبة في updateTasbihUI)
  const goal = tasbihTarget();
  const beads = document.querySelectorAll('.tasbih-bead');
  const filledBeads = goal > beads.length ? Math.floor((tasbihCount / goal) * beads.length) : tasbihCount;
  const target = beads[filledBeads - 1];
  if (target) { target.classList.add('flash'); setTimeout(() => target.classList.remove('flash'), 320); }
  // Floater
  Motion.floater(btn, '+1', 'var(--accent)');
  if (tasbihCount >= goal) {
    // تسجيل الجولة في الإحصائيات
    if (window.StatsManager) StatsManager.recordTasbih(goal);
    tasbihCount = 0;
    tasbihLap++;
    if (tasbihLap >= tasbihTotalLaps()) {
      tasbihLap = 0;
      document.getElementById('tasbih-msg').classList.add('active');
      document.getElementById('tasbih-msg').textContent = `أتممت ${toArabicNum(goal * tasbihTotalLaps())} تسبيحة - تقبل الله 🤲`;
      // احتفال كبير موحّد
      if (window.Celebrate) Celebrate(btn, { confetti: 80, burst: 14, ring: true, haptic: true });
      if (window.AccessibilityHelper) AccessibilityHelper.announceMessage('أتممت سبحة كاملة، تقبل الله');
    } else {
      // Lap complete: small celebration
      if (window.Celebrate) Celebrate(btn, { confetti: 0, burst: 14, ring: true, haptic: true });
      if (window.AccessibilityHelper) AccessibilityHelper.announceMessage(`جولة ${toArabicNum(tasbihLap)} مكتملة`);
    }
  } else {
    // Subtle tap pulse
    btn.classList.remove('tap-pulse'); void btn.offsetWidth; btn.classList.add('tap-pulse');
  }
  updateTasbihUI();
});
document.getElementById('tasbih-reset-btn').addEventListener('click', () => { tasbihCount = 0; tasbihLap = 0; document.getElementById('tasbih-msg').classList.remove('active'); updateTasbihUI(); });

let currentOccasionKeys = [];
function initOccasionSystem() {
  if (!hijriEngineAvailable) return;
  const now = new Date(); const hijri = getHijriDate(now); if (!hijri) return;
  currentOccasionKeys = getActiveOccasionKeys(hijri, now.getDay());

  const navRow = document.getElementById('occasion-nav-row'); const navLabel = document.getElementById('occasion-nav-label');
  if (currentOccasionKeys.length > 0) { navRow.style.display = ''; navLabel.textContent = currentOccasionKeys.length > 1 ? 'سنن وتذكيرات اليوم' : (OCCASIONS_DB[currentOccasionKeys[0]]?.title || 'سنن المناسبة'); }
  else { navRow.style.display = 'none'; }

  if (currentOccasionKeys.length > 0) {
    const periodKey = `${todayDateKey(now)}_${getCurrentPeriod(now)}`;
    if (localStorage.getItem('occasion_popup_last_period') !== periodKey) {
      const body = document.getElementById('occasion-modal-body'); document.getElementById('occasion-modal-title').textContent = currentOccasionKeys.length > 1 ? 'مناسبات وتذكيرات اليوم' : (OCCASIONS_DB[currentOccasionKeys[0]]?.title || 'مناسبة اليوم');
      body.innerHTML = currentOccasionKeys.map(k => { const o = OCCASIONS_DB[k]; return o ? `<div class="occasion-modal-item"><b>${o.icon} ${o.title}</b><br>${o.summary}</div>` : ''; }).join('');

function renderOccasionPage(keys) {
  const container = document.getElementById('occasion-list-container');
  if (!keys || keys.length === 0) { container.innerHTML = `<div class="occasion-empty">لا توجد مناسبة دينية خاصة مسجلة لهذا اليوم.</div>`; return; }
  container.innerHTML = keys.map(k => {

  }).join('') + `<div class="occasion-note">التاريخ الهجري المعروض محسوب فلكياً داخل التطبيق.</div>`;
  Motion.staggerIn(container, '.occasion-card');
}

document.addEventListener('DOMContentLoaded', () => {
  const localTodayStr = getLocalToday();
  Object.keys(localStorage).forEach(key => { if (key.startsWith('ath_') && !key.includes(localTodayStr)) localStorage.removeItem(key); });

  // شاشة البداية تُخفى عند جاهزية البيانات (انظر نهاية التهيئة)

  contentArea = document.getElementById('content');
  searchBar = document.getElementById('search-bar');
  clearBtn = document.getElementById('clear-search');

  initHijri(); loadState();
  // تسجيل Service Worker يتم مرة واحدة فقط في نهاية <body> (تجنّب التسجيل المزدوج)

  // حافظي على state.bookmark متزامناً مع BookmarkManager (نظام موحد للمرجعيات)
  window.addEventListener('bookmarksChanged', () => {
    if (state.bookmark?.type === 'surah' && window.BookmarkManager && !BookmarkManager.isSurahBookmarked(state.bookmark.id)) {
      state.bookmark = null; saveState(); checkBookmarkFAB();
    }
    updateBookmarkIcon();
  });

  applyTheme(state.theme || 'dark');
  applyFontSize(state.fontSize || 'large');

  document.querySelectorAll('.font-btn').forEach(btn => btn.addEventListener('click', function() { applyFontSize(this.dataset.size); }));
  document.getElementById('theme-btn').addEventListener('click', () => applyTheme(state.theme === 'dark' ? 'light' : 'dark'));

  // Reduced-motion: استجب للتغيير أثناء التشغيل وليس مرة واحدة فقط
  const rmMedia = window.matchMedia('(prefers-reduced-motion: reduce)');
  rmMedia.addEventListener?.('change', (e) => {
    if (e.matches) snapNavIndicator();
  });

  // Magnetic hover فقط للأزرار الرئيسية وعلى أجهزة المؤشر الدقيق
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    document.querySelectorAll('.btn-scale.primary, .quick-nav-card').forEach(el => Motion.magnetic(el, 0.08));
  }

  document.getElementById('share-btn').addEventListener('click', async () => {
    // شارك المحتوى الحالي إن وُجد، وإلا شارك التطبيق
    let text = 'جرب تطبيق إسلامي، صدقة جارية خفيف وسريع لقراءة القرآن الكريم، متابعة الختمة، وأذكار المسلم 🤍';
    if (state.currentScreen === 'surah-view' && state.currentSurah) {
      text = `﴿${state.currentSurah.name}﴾ — من تطبيق إسلامي 🤍`;
    } else if (state.currentScreen === 'thikr-view' && state.currentCatIndex !== null && ATHKAR[state.currentCatIndex]) {
      text = `${ATHKAR[state.currentCatIndex].name} — من تطبيق إسلامي 🤍\n${window.location.href}`;
    } else if (state.currentScreen === 'dua-list') {
      text = `أدعية النبي ﷺ — من تطبيق إسلامي 🤍`;
    }
    const shareData = { title: 'تطبيق إسلامي', text, url: window.location.href };
    try {
      if (navigator.share) await navigator.share(shareData);
      else {
        await navigator.clipboard.writeText(`${text}\n${shareData.url}`);
        await window.showAppDialog('تم نسخ الرابط بنجاح! 🤍<br><span style="font-size:calc(var(--font-size) * 0.5); color:var(--text-dim)">يمكنك الآن لصقه ومشاركته.</span>', false);
      }
    } catch (err) {}
  });

  // ===== نسخ نص الأذكار/الأدعية (تفويض الأحداث ليعمل على البطاقات المُعادة رسمها) =====
  document.addEventListener('click', async (e) => {
    const copyBtn = e.target.closest('.copy-btn');
    if (!copyBtn) return;
    const selector = copyBtn.dataset.copyFrom;
    const card = copyBtn.closest('.thikr-card, .dua-card');
    const textEl = card && selector ? card.querySelector(selector) : null;
    if (!textEl) return;
    const text = textEl.textContent.trim();
    const setDone = (ok) => {
      copyBtn.classList.toggle('copied', ok);
      copyBtn.setAttribute('aria-label', ok ? 'تم النسخ' : 'نسخ');
      setTimeout(() => copyBtn.classList.remove('copied'), 1600);
    };
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        setDone(true);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        setDone(ok);
      }
    } catch (err) {
      setDone(false);
    }
  });

  document.getElementById('back-btn').addEventListener('click', navigateBack);
  document.getElementById('bookmarks-btn').addEventListener('click', () => window.openBookmarks());
  document.getElementById('nav-dua-card').addEventListener('click', () => { showScreen('dua-list', 'slide-left'); document.getElementById('dua-list-container').innerHTML = DUA_LIST.map(d => `<div class="dua-card" data-magnetic><button class="copy-btn" data-copy-from=".dua-text" aria-label="نسخ الدعاء" title="نسخ"><span aria-hidden="true">⧉</span> نسخ</button><div class="dua-occasion">${d.occasion}</div><div class="dua-text">${d.text}</div></div>`).join(''); Motion.staggerIn(document.getElementById('dua-list-container')); });
  document.getElementById('nav-tasbih-card').addEventListener('click', () => { showScreen('tasbih', 'slide-left'); buildTasbih(); updateTasbihUI(); });
  document.getElementById('nav-occasion-card').addEventListener('click', () => { showScreen('occasion-list', 'slide-left'); renderOccasionPage(currentOccasionKeys); });

  document.getElementById('occasion-modal-ok').addEventListener('click', () => document.getElementById('occasion-overlay').classList.remove('active'));
  document.getElementById('occasion-overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('active'); });
  document.getElementById('occasion-modal-goto').addEventListener('click', () => { document.getElementById('occasion-overlay').classList.remove('active'); switchTab('athkar'); showScreen('occasion-list', 'slide-left'); renderOccasionPage(currentOccasionKeys); });

  document.querySelectorAll('.nav-tab').forEach(t => {
    t.addEventListener('pointerdown', createRipple);
    t.addEventListener('click', () => switchTab(t.dataset.tab));
    t.id = 'nav-tab-' + t.dataset.tab;
    t.setAttribute('aria-controls', 'screen-' + (t.dataset.tab === 'quran' ? 'surah-list' : t.dataset.tab === 'khatmah' ? 'khatmah-main' : 'athkar-list'));
  });
  // تنقل بين التبويبات بأسهم لوحة المفاتيح
  document.getElementById('nav').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const tabs = tabsArray;
    const cur = tabs.indexOf(state.currentTab);
    // RTL: السهم الأيمن يذهب للتبويب السابق
    const next = e.key === 'ArrowRight' ? (cur + tabs.length - 1) % tabs.length : (cur + 1) % tabs.length;
    e.preventDefault();
    switchTab(tabs[next]);
    document.querySelector(`.nav-tab[data-tab="${tabs[next]}"]`)?.focus();
  });

  // debouncing للبحث (150ms) لتفادي إعادة الرسم المتكرر على الأجهزة الضعيفة
  let _searchDebounce = null;
  searchBar.addEventListener('input', e => {
    const val = e.target.value.trim();
    if (val) { if (!clearBtn.style.display || clearBtn.style.display === 'none') { clearBtn.style.display = 'block'; clearBtn.style.transform = 'translateY(-50%) scale(0.7)'; requestAnimationFrame(() => clearBtn.style.transform = 'translateY(-50%) scale(1)'); } }
    else { clearBtn.style.transform = 'translateY(-50%) scale(0.7)'; setTimeout(() => clearBtn.style.display = 'none', 200); }
    clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(() => {
      const norm = text => text.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/[\u064B-\u065F]/g, '');
      const nVal = norm(val);
      const filtered = allSurahs.filter(s => norm(s.name).includes(nVal) || s.number.toString() === val);
      renderSurahList(filtered, nVal);
    }, 150);
  });
  clearBtn.addEventListener('click', () => { searchBar.value = ''; clearBtn.style.transform = 'translateY(-50%) scale(0.7)'; setTimeout(() => clearBtn.style.display = 'none', 200); renderSurahList(allSurahs); searchBar.focus(); });

  window.addEventListener('resize', () => { syncNavSafeArea(); snapNavIndicator(); });
  bindGesturesAndScroll();

  // اضبط الفراغ البصري لشريط التنقل حسب منطقة الأمان الفعلية للجهاز.
  // CSS لا يستطيع قياس env() كرقم، لذا نقيسه هنا مرة واحدة عند البدء
  // وعند أي تغيير في المقاس أو الاتجاه.
  //
  // هذه الدالة هي المالك الوحيد لـ --nav-gap. لا تضبطه في @media داخل CSS:
  // الكتابة هنا تذهب كـ inline style على <html>، وهي تتغلّب على قواعد
  // :root داخل @media — فأي قيمة هناك ستكون ميتة.
  function syncNavSafeArea() {
    // نقيس منطقة الأمان بواسطة عنصر وهمي يعتمد على env()
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);width:0;pointer-events:none;visibility:hidden;';
    document.body.appendChild(probe);
    const inset = probe.getBoundingClientRect().height || 0;
    document.body.removeChild(probe);

    // 10px هو الأساس المقصود: الشريط لأسفل قليلاً عن الحافة ليتنفّس،
    // لا ملتصقاً بها. و--nav-drop في CSS تضيف النزول الإضافي فوق المنطقة الآمنة.
    //
    // الاستثناءان — كلاهما يقلّل الفراغ بدل أن يزيده:
    //  1. شاشات قصيرة/أفقية: نمرّر ارتفاع الشريط المصغّر هنا لأن الدالة
    //     لا تستطيع قراءة ما تضبطه @media. بدون هذا يبقى فراغ شاشة 620px
    //     كما هو على شاشة 900px.
    //  2. منطقة آمنة سميكة (أندرويد بثلاثة أزرار ≈ 48px): المنطقة وحدها تحجز
    //     مسافة كبيرة، فنقلّل الفراغ تدريجياً حتى لا يرتفع الشريط أكثر من اللازم.
    const shortScreen = window.innerHeight <= 620;
    const landscape  = window.innerHeight <= 500 && window.innerWidth > window.innerHeight;
    const baseGap    = landscape ? 6 : (shortScreen ? 8 : 10);
    const gap = Math.max(6, Math.min(baseGap, baseGap - Math.max(0, inset - 28) * 0.2));
    document.documentElement.style.setProperty('--nav-gap', gap.toFixed(2) + 'px');
  }
  syncNavSafeArea();

  snapNavIndicator();
  initOccasionSystem(); switchTab(state.currentTab || 'quran');
  checkBookmarkFAB();

  // هيكل تحميل (Skeleton) للقائمة الرئيسية حتى جلب البيانات
  document.getElementById('surah-list-container').innerHTML = getSkeletonHTML();
  // أخفِ شاشة البداية بعد أن تبقى ظاهرة مدة كافية لتُدرَك (≈1.5 ثانية)
  // loadSurahList() قد تكتمل أسرع بكثير من ذلك، لذا نفرض حداً أدنى للمدة
  // بدل إخفاء الشاشة فور جاهزية البيانات.
  const _splash = document.getElementById('splash-screen');
  const SPLASH_MIN_MS = 1500;   // المدة الدنيا لعرض شاشة البداية
  const SPLASH_MAX_MS = 4000;   // حد أقصى احتياطي: لا ننتظر البيانات للأبد
  const _splashStart = performance.now();
  let _splashHidden = false;
  const hideSplash = () => {
    if (_splashHidden || !_splash || _splash.style.display === 'none') return;
    // انتظر ما تبقّى من المدة الدنيا قبل البدء بالتلاشي
    const elapsed = performance.now() - _splashStart;
    const remaining = Math.max(0, SPLASH_MIN_MS - elapsed);
    setTimeout(() => {
      if (_splashHidden) return;
      _splashHidden = true;
      _splash.style.opacity = '0';
      _splash.style.transform = 'scale(1.06)';
      setTimeout(() => { _splash.style.display = 'none'; }, 500);
    }, remaining);
  };
  loadSurahList().then(hideSplash).catch(hideSplash);
  setTimeout(hideSplash, SPLASH_MAX_MS); // حد أقصى احتياطي

  let isDraggingNav = false; let navStartX = 0; let indicatorStartX = 0;
  let navDragLastX = 0, navDragLastT = 0;
  const navBar = document.getElementById('nav'); const navIndicator = document.getElementById('nav-indicator');

  function getClientX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
  function handleDragStart(e) {
    if (e.target.closest('#nav')) {
      const activeTab = document.querySelector('.nav-tab.active'); if(!activeTab) return;
      // أوقف أي حركة زنبركية جارية أثناء السحب
      if (navSpring.raf) { cancelAnimationFrame(navSpring.raf); navSpring.running = false; }
      isDraggingNav = true; navStartX = getClientX(e); indicatorStartX = activeTab.offsetLeft;
      navDragLastX = indicatorStartX; navDragLastT = performance.now();
      navSpring.x = indicatorStartX; navSpring.w = activeTab.offsetWidth;
      applyNavIndicator(indicatorStartX, activeTab.offsetWidth, 0.96, 0.94);
    }
  }
  function handleDragMove(e) {
    if(!isDraggingNav) return;
    const dx = getClientX(e) - navStartX; let newX = indicatorStartX + dx;
    const minX = 0; const maxX = navBar.offsetWidth - navIndicator.offsetWidth;
    if (newX < minX) newX = minX - Math.pow(minX - newX, 0.8);
    if (newX > maxX) newX = maxX + Math.pow(newX - maxX, 0.8);
    const stretch = 1 + Math.min(Math.abs(dx) / 400, 0.22);
    applyNavIndicator(newX, navSpring.w, stretch, 0.92);
    // تتبع السرعة اللحظية لتسليمها للزنبرك عند الإفلات
    const now = performance.now();
    const dtMs = now - navDragLastT;
    if (dtMs > 0) { navSpring.vx = (newX - navDragLastX) / dtMs * 1000; }
    navDragLastX = newX; navDragLastT = now;
    navSpring.x = newX;
  }
  function handleDragEnd(e) {
    if(!isDraggingNav) return;
    isDraggingNav = false;
    const currentTransformMatch = navIndicator.style.transform.match(/translateX\(([^p]+)px\)/);
    const currentTransformX = currentTransformMatch ? parseFloat(currentTransformMatch[1]) : indicatorStartX;
    navSpring.x = currentTransformX;
    // حدّد السرعة القصوى لتجنب رد فعل عنيف
    navSpring.vx = Math.max(-1600, Math.min(1600, navSpring.vx));
    const indicatorCenter = currentTransformX + (navIndicator.offsetWidth / 2);
    let closestTab = null; let minDistance = Infinity;
    document.querySelectorAll('.nav-tab').forEach(tab => {
      const tabCenter = tab.offsetLeft + (tab.offsetWidth / 2); const dist = Math.abs(indicatorCenter - tabCenter);
      if(dist < minDistance) { minDistance = dist; closestTab = tab; }
    });
    if(closestTab && closestTab.dataset.tab !== state.currentTab) switchTab(closestTab.dataset.tab); else setNavIndicator();
  }

  navBar.addEventListener('touchstart', handleDragStart, {passive: true});
  navBar.addEventListener('touchmove', handleDragMove, {passive: true});
  navBar.addEventListener('touchend', handleDragEnd);
  navBar.addEventListener('mousedown', handleDragStart);
  window.addEventListener('mousemove', handleDragMove);
  window.addEventListener('mouseup', handleDragEnd);

  window.showAppDialog = function(message, isConfirm = false) {
    return new Promise((resolve) => {
      const overlay = document.getElementById('custom-dialog-overlay');
      const msgEl = document.getElementById('custom-dialog-text');
      const btnOk = document.getElementById('custom-dialog-ok');
      const btnCancel = document.getElementById('custom-dialog-cancel');
      msgEl.innerHTML = message;
      btnCancel.style.display = isConfirm ? 'block' : 'none';
      btnOk.textContent = isConfirm ? 'موافق' : 'حسناً';
      overlay.classList.add('active');

      // نضمن إنهاء الـ Promise دائماً (زر، خلفية، أو Escape) حتى لا يعلق الكود
      let settled = false;
      const dismiss = (result) => {
        if (settled) return;
        settled = true;
        overlay.classList.remove('active');
        document.removeEventListener('keydown', onKey);
        resolve(result);
      };
      const onKey = (e) => { if (e.key === 'Escape') dismiss(isConfirm ? false : true); };
      document.addEventListener('keydown', onKey);

      btnOk.onclick = () => dismiss(true);
      btnCancel.onclick = () => dismiss(false);
      overlay.onclick = (e) => { if (e.target === overlay) dismiss(isConfirm ? false : true); };
    });
  };
});
</script>
