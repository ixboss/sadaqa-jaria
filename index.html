<style>
/* ==================== استيراد خط المصحف العثماني + Amiri للواجهة ==================== */
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap');

/* ==================== متغيرات التصميم (الوضع الداكن الافتراضي) ==================== */
:root {
  /* ===== الهوية اللونية الجديدة: زمردی + فيروزي + أزرق ليلي + كريمي ===== */
  --bg: #0a1f28;            /* أزرق ليلي عميق مائل للفيروز (ليس أسوداً) */
  --surface: #10333f;       /* سطح فيروزي عميق */
  --surface-2: #16414e;     /* سطح أفتح للتباين */
  --accent: #3ecf9e;        /* أخضر زمردي مضيء - للعناصر الصغيرة على الخلفيات الداكنة */
  --accent-deep: #12805e;   /* زمردي عميق - للخلفيات والأزرار (مع نص كريمي) */
  --accent-2: #46c8d6;      /* فيروزي - لون ثانوي */
  --accent-dim: rgba(62, 207, 158, 0.14);
  --accent-grad: linear-gradient(135deg, #16906b, #0f6d7a);
  --header-grad: linear-gradient(135deg, #15604c, #0e4a57);
  --text: #f3f0e7;          /* أبيض دافئ */
  --text-dim: #9fb8b6;      /* رمادي ناعم مائل للأخضر */
  --success: #4fd1a5;
  --border: #1f4b5a;
  /* ===== أسماء دلالية للألوان (لتسهيل التغيير المستقبلي) ===== */
  --color-success: var(--success);
  --color-on-accent: #f4f1e8;   /* نص فوق الأزرار الملوّنة */
  --color-on-accent-soft: rgba(244, 241, 232, 0.85);
  --color-shadow: rgba(0, 0, 0, 0.4);
  --radius: 12px;
  /* ===== نظام الخطوط: حجم أساسي واحد × نسبة تكبير واحدة ===== */
  --font-base: 26px;                        /* الحجم المرجعي (متوسط) */
  --font-scale: 1;                          /* نسبة التكبير: 0.8 / 1 / 1.4 */
  --font-size: calc(var(--font-base) * var(--font-scale));  /* الحجم الفعلي المشتق */
  --line-height: 2.3;
  /* ===== نظام المصحف: حجم مستقل عن حجم الواجهة ===== */
  /* حتى لو صغّر المستخدم الواجهة، يبقى نص المصحف مريحاً للقراءة */
  --mushaf-base: 34px;                      /* حجم نص المصحف المرجعي */
  --mushaf-scale: 1;                        /* نسبة تكبير مستقلة: 0.8 / 1 / 1.4 */
  --mushaf-size: calc(var(--mushaf-base) * var(--mushaf-scale));
  --mushaf-lh: 2.15;                        /* ارتفاع سطر مستقل للمصحف */
  --header-h: 70px;

  /* ===== هندسة شريط التنقل السفلي ===== */
  /* ارتفاع الشريط */
  --nav-h: 70px;
  /* الفراغ البصري بين الشريط وأسفل الشاشة — صغير ومقصود ليلتصق الشريط
     بالحافة السفلية. منطقة الأمان (safe area) تُضاف فوقه دائماً عبر env(). */
  --nav-gap: 10px;
  /* إزاحة إضافية لأسفل الشريط (تصميمية لا وظيفية).
     كان الشريط يجلس على مسافة 6–10px فقط من الحافة (و6px على الأجهزة ذات
     المنطقة الآمنة السميكة)، فيبدو ملتصقاً بالأسفل بلا تنفّس.
     هذه القيمة تضيف نزولاً حقيقياً فوق منطقة الأمان ليتوازن الشكل.
     0 = بلا إزاحة. لزيادة النزول: كبّر هذه القيمة فقط.
     تحذير: لا تستخدم قيمة سالبة، ولا تعبث بـ --nav-gap — قيمة سالبة هناك
     تُخرج الشريط خارج الشاشة. */
  --nav-drop: 10px;
  /* إجمالي المسافة من أسفل الشاشة = فراغ بصري + منطقة الأمان + إزاحة اختيارية */
  --nav-bottom: calc(var(--nav-gap) + env(safe-area-inset-bottom, 0px) + var(--nav-drop));
  /* المسافة التي يحتاجها أي عنصر ليجلس فوق الشريط بارتياح.
     = ارتفاع الشريط + الفراغ أسفله + هامش مريح فوقه. */
  --nav-clearance: calc(var(--nav-h) + var(--nav-gap) + var(--nav-drop) + 20px);
  /* نفس المسافة + منطقة الأمان: للعناصر الثابتة فوق الشريط */
  --nav-clearance-safe: calc(var(--nav-h) + var(--nav-gap) + var(--nav-drop) + 20px + env(safe-area-inset-bottom, 0px));

/* Motion & animation tokens */
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out-quart: cubic-bezier(0.76, 0, 0.24, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring-soft: cubic-bezier(0.5, 1.5, 0.4, 1);
  --ease-spring-snap: cubic-bezier(0.5, 1.7, 0.6, 1);
  --motion-ease-fast: cubic-bezier(.2,.9,.3,1);
  --motion-ease: cubic-bezier(.22,.9,.3,1);
  --motion-ease-slow: cubic-bezier(.2,.7,.3,1);
  --motion-duration-fast: 180ms;
  --motion-duration: 260ms;
  --motion-duration-slow: 420ms;
  --motion-duration-slower: 700ms;
  --stagger-step: 50ms;
  --bounce-step: 12ms;
}

/* Respect users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
.ripple, .confetti-piece, .burst-particle { display: none !important; }
[style*="--reveal-delay"] { transition-delay: 0ms !important; }
}

/* ==================== Keyframe Library ==================== */
@keyframes ripple-anim { to { transform: scale(3.5); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes pulse-green {
  0% { box-shadow: 0 0 0 0 rgba(76, 175, 125, 0.4); }
  70% { box-shadow: 0 0 0 15px rgba(76, 175, 125, 0); }
  100% { box-shadow: 0 0 0 0 rgba(76, 175, 125, 0); }
}

/* New: depth-in adds a subtle scale for layered feel */
@keyframes depthIn { from { opacity: 0; transform: scale(0.97) translateY(14px); filter: blur(4px); } to { opacity: 1; } }
@keyframes depthOut { from { opacity: 1; transform: scale(1); filter: blur(0); } to { opacity: 0; transform: scale(1.02); filter: blur(2px); } }

/* New: count pop for number feedback */
@keyframes countPop { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 70% { transform: scale(0.95); } 100% { transform: scale(1); } }

/* New: surge ring (success / completion) */
@keyframes surgeRing { 0% { transform: scale(0.6); opacity: 0.7; } 100% { transform: scale(2.4); opacity: 0; } }

/* New: float up + fade for transient labels (e.g. +1 badge) */
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(0.9); } }

/* New: shimmer wave for skeleton loading */
@keyframes shimmerWave { 0% { background-position: -120% 0; } 100% { background-position: 220% 0; } }

/* New: gradient flow for progress bar */
@keyframes gradientFlow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

/* New: gentle float for empty illustrations */
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* New: bounce-down for tap thikr pulse */
@keyframes tapPulse { 0% { box-shadow: 0 0 0 0 var(--accent-dim); } 100% { box-shadow: 0 0 0 18px transparent; } }

/* New: confetti drop (used via inline styles for variety) */
@keyframes confettiDrop { 0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 1; } 100% { transform: translate3d(var(--dx, 0), 110vh, 0) rotate(var(--dr, 720deg)); opacity: 0.9; } }

/* New: header glow pulse on theme switch */
@keyframes themeFlash { 0% { box-shadow: 0 2px 15px rgba(0,0,0,0.3); } 50% { box-shadow: 0 4px 30px var(--accent-dim); } 100% { box-shadow: 0 2px 15px rgba(0,0,0,0.3); } }

/* New: ring fill for tasbih bead active */
@keyframes beadGlow { 0% { box-shadow: 0 0 0 0 var(--accent-dim); } 100% { box-shadow: 0 0 12px var(--accent); } }

/* Reveal / entrance animations */
.reveal-hidden { opacity: 0; transform: translateY(8px); will-change: opacity, transform; transition: opacity var(--motion-duration) var(--ease-out-quart), transform var(--motion-duration) var(--ease-out-quart); }
.reveal-hidden.in { opacity: 1; transform: none; }
.reveal-hidden[style*="--reveal-delay"] { transition-delay: var(--reveal-delay); }
@keyframes depthInStagger { from { opacity: 0; transform: translateY(12px) scale(0.985); filter: blur(2px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

/* Bookmark microinteraction */
.bookmark-btn { transition: transform var(--motion-duration-fast) var(--ease-spring-snap), color var(--motion-duration) var(--ease-out-quart), background var(--motion-duration) var(--ease-out-quart); will-change: transform; }
.bookmark-btn.active { transform: scale(1.12); color: var(--accent); }
.bookmark-btn.pop { animation: countPop 480ms var(--ease-spring-snap); }

/* Ripple effect (lightweight) */
.ripple { position: absolute; border-radius: 50%; transform: scale(0); animation: ripple-anim 500ms linear; background-color: rgba(255,255,255,0.22); pointer-events: none; z-index: 0; }
.ripple.dark { background-color: rgba(255,255,255,0.25); }

/* Floating counter badge (+1 / +3) */
.floater { position: absolute; left: 50%; top: 50%; pointer-events: none; z-index: 5; font-weight: 800; color: var(--accent); text-shadow: 0 1px 6px rgba(0,0,0,0.4); font-size: calc(var(--font-size) * 0.8); animation: floatUp 900ms var(--ease-out-quart) forwards; }

/* Burst particles (used on bookmark, completion) */
.burst-particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); pointer-events: none; z-index: 1; animation: burstFly 700ms var(--ease-out-quart) forwards; }
@keyframes burstFly { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--bx, 0), var(--by, 0)) scale(0.4); opacity: 0; } }

/* Confetti pieces */
.confetti-piece { position: fixed; top: -10vh; width: 8px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 10001; animation: confettiDrop 1800ms cubic-bezier(0.2, 0.6, 0.4, 1) forwards; }

/* Tap pulse on thikr / count buttons */
.tap-pulse { animation: tapPulse 420ms var(--ease-out-quart); }

/* Button microinteraction */
.header-btn, .btn-scale, .nav-tab { will-change: transform; transition: transform var(--motion-duration-fast) var(--ease-spring), box-shadow var(--motion-duration) var(--ease-out-quart), background var(--motion-duration) var(--ease-out-quart), color var(--motion-duration) var(--ease-out-quart); }
.header-btn:active, .btn-scale:active, .nav-tab:active { transform: translateY(2px) scale(0.985); }
.btn-scale:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px var(--accent-dim); }
.btn-scale { position: relative; overflow: hidden; }

/* Magnetic pull: data-magnetic target (subtle, capped) */
[data-magnetic] { transition: transform 180ms var(--ease-out-quart); }

/* Stagger helper for lists */
[data-stagger] > * { opacity: 0; transform: translateY(12px) scale(0.985); }
[data-stagger].mounted > * { opacity: 1; transform: none; transition: opacity 420ms var(--ease-out-quart) var(--stagger-delay), transform 480ms var(--ease-out-quart) var(--stagger-delay), filter 420ms var(--ease-out-quart) var(--stagger-delay); filter: blur(0); }
[data-stagger].mounted > *:nth-child(1)  { --stagger-delay: 0ms; }
[data-stagger].mounted > *:nth-child(2)  { --stagger-delay: 50ms; }
[data-stagger].mounted > *:nth-child(3)  { --stagger-delay: 100ms; }
[data-stagger].mounted > *:nth-child(4)  { --stagger-delay: 150ms; }
[data-stagger].mounted > *:nth-child(5)  { --stagger-delay: 200ms; }
[data-stagger].mounted > *:nth-child(6)  { --stagger-delay: 250ms; }
[data-stagger].mounted > *:nth-child(7)  { --stagger-delay: 300ms; }
[data-stagger].mounted > *:nth-child(8)  { --stagger-delay: 350ms; }
[data-stagger].mounted > *:nth-child(9)  { --stagger-delay: 400ms; }
[data-stagger].mounted > *:nth-child(10) { --stagger-delay: 450ms; }
[data-stagger].mounted > *:nth-child(11) { --stagger-delay: 500ms; }
[data-stagger].mounted > *:nth-child(12) { --stagger-delay: 550ms; }
[data-stagger].mounted > *:nth-child(n+13) { --stagger-delay: 600ms; }

/* FLIP support: when a list re-orders, items get a brief transform */
.flip-anim { transition: transform 380ms var(--ease-out-quart) !important; }

/* Smooth number transitions */
.count-anim { display: inline-block; transition: transform 360ms var(--ease-spring-snap), color 360ms var(--ease-out-quart); will-change: transform; }
.count-anim.pop { animation: countPop 480ms var(--ease-spring-snap); }

/* Reading progress with gradient flow — تعمل فقط عندما يكون الشريط ظاهراً */
#reading-progress-bar { background: linear-gradient(90deg, #eafff6 0%, #8fe3c0 50%, #eafff6 100%); background-size: 200% 100%; animation: none; }
#reading-progress-container[style*="display: block"] #reading-progress-bar { animation: gradientFlow 2.4s linear infinite; }
body.theme-light #reading-progress-bar { background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 50%, var(--accent) 100%); background-size: 200% 100%; }

/* Theme crossfade: when html.theme-transitioning, all themed colors interpolate.
   نستثني العناصر التي تعتمد على الحركة حتى لا تتعطّل أثناء تبديل السمة */
html.theme-transitioning, html.theme-transitioning *:not(.nav-indicator):not(#reading-progress-bar):not(.reveal-hidden):not([data-magnetic]):not([data-stagger] > *):not([data-stagger]) { transition: background-color 480ms var(--ease-out-quart), color 480ms var(--ease-out-quart), border-color 480ms var(--ease-out-quart) !important; }

/* Header parallax root */
#header { will-change: transform, box-shadow; }
#header.theme-flash { animation: themeFlash 600ms var(--ease-out-quart); }

/* Modal spring entry */
@keyframes modalSpringIn { 0% { opacity: 0; transform: translateY(20px) scale(0.85); } 60% { opacity: 1; transform: translateY(-4px) scale(1.02); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
#custom-dialog, #occasion-modal { animation: modalSpringIn 480ms var(--ease-spring-snap) both; transform-origin: center; }

/* Backdrop blur ramp for modals */
@keyframes backdropIn { from { opacity: 0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); } }
#custom-dialog-overlay.active, #occasion-overlay.active { animation: backdropIn 320ms var(--ease-out-quart) both; }
#custom-dialog-overlay, #occasion-overlay { animation-fill-mode: both; }

/* Surge ring used on success */
.surge-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: surgeRing 720ms var(--ease-out-quart) forwards; pointer-events: none; }

/* Tasbih bead improved glow */
.tasbih-bead.filled { background: var(--accent); border-color: var(--accent); transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 10px var(--accent); transition: transform 280ms var(--ease-spring-snap), background 280ms var(--ease-out-quart), box-shadow 280ms var(--ease-out-quart); }

/* Floating on empty states */
.occasion-empty { animation: float 3.6s ease-in-out infinite; }

/* Splash screen polish */
#splash-screen { animation: none; transition: opacity 500ms var(--ease-out-quart), transform 500ms var(--ease-out-quart), background 480ms var(--ease-out-quart); }
@keyframes splashBreathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.92; } }
.splash-content > * { animation: splashBreathe 1.6s ease-in-out infinite; }
.splash-content > *:nth-child(2) { animation-delay: 200ms; }

/* Header title pop on screen change */
#header-title { display: inline-block; }
#header-title.title-in { animation: countPop 380ms var(--ease-spring-snap); }

/* Back button spring entry */
@keyframes btnSpringIn { 0% { opacity: 0; transform: scale(0.4) rotate(-12deg); } 60% { opacity: 1; transform: scale(1.12) rotate(4deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.btn-spring-in { animation: btnSpringIn 420ms var(--ease-spring-snap) !important; }

/* Bead flash on tap */
.tasbih-bead.flash { animation: beadGlow 320ms var(--ease-out-quart); }

/* Lap dot pop on lap complete */
.tasbih-lap-dot.pop { animation: countPop 480ms var(--ease-spring-snap); }

/* Resume FAB visibility */
#resume-fab { opacity: 0; transform: translateY(20px) scale(0.9); pointer-events: none; transition: opacity 320ms var(--ease-out-quart), transform 380ms var(--ease-spring-snap), background 320ms var(--ease-out-quart); }
#resume-fab.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

/* Pop utility */
.pop { animation: countPop 480ms var(--ease-spring-snap); }

/* Card hover lift */
.surah-row, .quick-nav-card, .athkar-cat-card, .dua-card, .occasion-card, .thikr-card, .k-dash-card, .khatmah-setup-box, .sk-card { transition: transform 280ms var(--ease-out-quart), border-color 280ms var(--ease-out-quart), box-shadow 280ms var(--ease-out-quart), background 280ms var(--ease-out-quart); will-change: transform; }
@media (hover: hover) {
  .surah-row:hover, .quick-nav-card:hover, .athkar-cat-card:hover, .dua-card:hover, .occasion-card:hover, .thikr-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 10px 28px rgba(0,0,0,0.25); }
  body.theme-light .surah-row:hover, body.theme-light .quick-nav-card:hover, body.theme-light .athkar-cat-card:hover, body.theme-light .dua-card:hover, body.theme-light .occasion-card:hover, body.theme-light .thikr-card:hover { box-shadow: 0 10px 28px rgba(0,0,0,0.08); }
}

/* Thikr done flash */
.thikr-tap-btn.done { animation: countPop 520ms var(--ease-spring-snap); }

/* Subtle shrink on press for cards */
.surah-row:active, .athkar-cat-card:active, .quick-nav-card:active { transform: scale(0.985); }

/* Focus indicators for keyboard users */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ==================== الوضع الفاتح الاحترافي (Light Mode) ==================== */
body.theme-light {
  --bg: #f5f1e8;            /* كريمي دافئ */
  --surface: #fffdf7;       /* أبيض دافئ */
  --surface-2: #ece5d6;     /* بيج فاتح */
  --accent: #1f7a5a;        /* زمردي عميق للنصوص على الخلفيات الفاتحة */
  --accent-deep: #1f7a5a;
  --accent-2: #12837f;      /* فيروزي عميق */
  --accent-dim: rgba(31, 122, 90, 0.12);
  --accent-grad: linear-gradient(135deg, #1f7a5a, #12837f);
  --header-grad: linear-gradient(135deg, #e8f1eb, #eef3ef);
  --text: #14333a;          /* أزرق مخضر عميق (ليس أسوداً) */
  --text-dim: #5c7276;      /* رمادي ناعم */
  --success: #2e8b57;
  --border: #ddd4c1;
  /* أسماء دلالية (الوضع الفاتح) */
  --color-success: var(--success);
  --color-on-accent: #ffffff;
  --color-on-accent-soft: rgba(255, 255, 255, 0.9);
  --color-shadow: rgba(20, 51, 58, 0.15);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif; direction: rtl; overflow: hidden; transition: background 0.4s, color 0.4s; user-select: none; -webkit-user-select: none; }
.mushaf-block { user-select: text; -webkit-user-select: text; }

/* نقش الخلفية — شبكة تدرجات خفيفة بدلاً من مربع SVG متكرر (أخف على GPU) */
body::before {
  content: ''; position: fixed; inset: 0; opacity: 0.05; pointer-events: none; z-index: 0; transition: opacity 0.4s;
  background-image:
    radial-gradient(circle at 18% 12%, var(--accent) 0, transparent 42%),
    radial-gradient(circle at 82% 78%, var(--accent-2) 0, transparent 46%),
    radial-gradient(circle at 68% 8%, var(--accent-2) 0, transparent 38%),
    radial-gradient(circle at 8% 88%, var(--accent) 0, transparent 40%);
}
body.theme-light::before { opacity: 0.04; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(62, 207, 158, 0.3); border-radius: 10px; }
body.theme-light ::-webkit-scrollbar-thumb { background: rgba(31, 122, 90, 0.25); }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; z-index: 1; }

/* ==================== الشريط العلوي ==================== */
#header { height: var(--header-h); background: var(--header-grad); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; z-index: 100; box-shadow: 0 2px 15px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.10); transition: background 0.4s, box-shadow 0.4s; }
body.theme-light #header { box-shadow: 0 2px 15px rgba(20, 51, 58, 0.08), inset 0 1px 0 rgba(255,255,255,0.9); border-bottom: 1px solid var(--border); }

#reading-progress-container { position: fixed; top: var(--header-h); left: 0; right: 0; height: 3px; background: transparent; z-index: 99; display: none; pointer-events: none; }
#reading-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3ecf9e 0%, #46c8d6 50%, #3ecf9e 100%); transition: width 0.1s ease-out; }

.header-center { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: center; }
#header-title { font-size: calc(var(--font-size) * 0.7); font-weight: 700; color: #f0f7f2; transition: color 0.4s; }
body.theme-light #header-title { color: var(--accent); }
#header-subtitle { font-size: calc(var(--font-size) * 0.42); font-weight: bold; color: #c3ded2; margin-top: 2px; direction: rtl; transition: color 0.4s, font-size 0.3s; }
body.theme-light #header-subtitle { color: var(--text-dim); }

#back-btn { display: none; background: rgba(255,255,255,0.14); border: none; border-radius: 8px; color: #f0f7f2; font-size: calc(var(--font-size) * 0.85); cursor: pointer; width: 40px; height: 40px; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
body.theme-light #back-btn { background: var(--surface-2); color: var(--text); }
#back-btn:active { transform: scale(0.9); }
#back-btn.visible { display: flex; }

#font-ctrl { display: flex; gap: 4px; flex-shrink: 0; }
.header-btn { background: rgba(255,255,255,0.14); border: none; border-radius: 6px; color: #f0f7f2; font-size: calc(var(--font-size) * 0.58); cursor: pointer; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-weight: bold; }
body.theme-light .header-btn { background: var(--surface-2); color: var(--text); }
.header-btn:active { transform: scale(0.9); }
.header-btn.active { background: rgba(255,255,255,0.22); color: #eafff5; }
body.theme-light .header-btn.active { background: var(--accent); color: #fff; }

#content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-clearance-safe) + 36px); scroll-behavior: smooth; touch-action: pan-y; }

/* ==================== الشريط السفلي الزجاجي (Liquid Glass) ==================== */
#nav {
  /* الشريط يلتصق بالحافة السفلية: فراغ بصري صغير (--nav-gap) فوق منطقة الأمان.
     في الوضع المثبّت على الشاشة الرئيسية تكون env(safe-area-inset-bottom) هي
     شريط iOS السفلي (~34px)، فيجلس الشريط فوقه مباشرة بدل أن يطفو في الفراغ. */
  position: fixed; bottom: var(--nav-bottom); left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 420px; height: var(--nav-h);
  /* طبقات زجاجية: تدرج علوي لامع + قاعدة معتمة.
     القاعدة كانت شبه شفافة (55%) فكان نص السور يظهر من خلف الشريط
     ويبدو مقصوصاً. الآن 96% — يحافظ على إحساس الزجاج (بفضل التدرج
     العلوي و backdrop-filter) لكن يمنع قراءة المحتوى من خلفه. */
  background:
    linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02) 55%, rgba(255,255,255,0.05)),
    rgba(12, 42, 52, 0.96);
  backdrop-filter: blur(26px) saturate(185%); -webkit-backdrop-filter: blur(26px) saturate(185%);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 35px;
  display: flex; align-items: center; padding: 0 6px; z-index: 100;
  /* عمق: ظل خارجي ناعم + ضوء داخلي علوي + ظل داخلي سفلي */
  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.45),
    0 2px 8px rgba(0, 0, 0, 0.25),
    inset 0 1px 1px rgba(255, 255, 255, 0.22),
    inset 0 -1px 2px rgba(0, 0, 0, 0.25);
  transition: bottom 380ms var(--ease-spring), transform 380ms var(--ease-spring), opacity 0.4s, background 0.4s, border-color 0.4s, box-shadow 0.4s;
  touch-action: none;
}

body.theme-light #nav {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.78) 55%, rgba(255,255,255,0.88)),
    rgba(255, 253, 247, 0.97);
  border: 1px solid rgba(31, 122, 90, 0.18);
  box-shadow:
    0 18px 40px rgba(20, 51, 58, 0.14),
    0 2px 8px rgba(20, 51, 58, 0.08),
    inset 0 1px 1px rgba(255, 255, 255, 1),
    inset 0 -1px 2px rgba(20, 51, 58, 0.08);
}
/* عند إخفاء شريط التنقل أثناء التمرير: ينزلق للأسفل بسلاسة (bottom) بدل التحول المفاجئ.
   يُحسب من --nav-bottom نفسه حتى تنزلق المسافة الصحيحة تماماً بعد إضافة --nav-drop. */
#nav.nav-hidden { bottom: calc(-1 * (var(--nav-h) + var(--nav-gap) + var(--nav-drop) + 20px) + env(safe-area-inset-bottom, 0px)); opacity: 0; pointer-events: none; }

/* ===== المؤشر الزجاجي السائل (Liquid Glass indicator) ===== */
/* طبقة تعتيم خلف الشريط: تمنع ظهور نص المحتوى المقصوص من حول حواف
   الشريط الدائرية، وهي المنطقة التي كان النص يظهر فيها بوضوح.
   ملاحظة: الشريط ينشئ سياق تكديس خاصاً (z-index: 100)، لذا لا يمكن
   استخدام z-index سالب هنا — الطبقة تُرسم فوق خلفية الشريط لكن تحت
   العناصر التفاعلية، وهذا كافٍ لأن دورها تغطية المنطقة المحيطة. */
.nav-scrim {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: calc(var(--nav-bottom) + var(--nav-h) - 26px);
  pointer-events: none; z-index: 90;
  background: linear-gradient(180deg, transparent, var(--bg) 34%);
  opacity: 0; transition: opacity 300ms var(--ease-out-quart);
}
/* نظهر الطبقة فقط عندما يكون الشريط في مكانه الطبيعي (غير مخفي) */
body:has(#nav:not(.nav-hidden)) .nav-scrim { opacity: 1; }
/* بديل للمتصفحات التي لا تدعم :has() */
#nav:not(.nav-hidden) ~ .nav-scrim { opacity: 1; }

.nav-indicator {
  position: absolute; left: 0; top: 6px; bottom: 6px; width: 0;
  /* طبقات: ضوء علوي داخلي + صبغة زمردي/فيروزية شفافة */
  background:
    linear-gradient(160deg, rgba(255,255,255,0.30), rgba(255,255,255,0.06) 46%, rgba(255,255,255,0.14)),
    linear-gradient(135deg, rgba(62, 207, 158, 0.42), rgba(70, 200, 214, 0.20));
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 26px; z-index: 1;
  /* ضوء داخلي ناعم + حدود ناعمة + توهج زمردي خفيف */
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.38),
    inset 0 -1px 2px rgba(0, 0, 0, 0.18),
    0 6px 16px rgba(0, 0, 0, 0.30),
    0 0 20px rgba(62, 207, 158, 0.22);
  backdrop-filter: blur(6px) saturate(140%); -webkit-backdrop-filter: blur(6px) saturate(140%);
  pointer-events: none;
  transform-origin: center;
  will-change: transform, width;
  overflow: hidden;
  /* لا تستخدم transition: الحركة يقودها محرك الـ spring في JS */
}
/* ضوء علوي ثابت داخل المؤشر (Inner light) */
.nav-indicator::before {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 45%;
  background: linear-gradient(180deg, rgba(255,255,255,0.30), transparent);
  border-radius: 26px 26px 0 0; pointer-events: none;
}
/* وميض زجاجي يمر عند الاستقرار (Specular sheen) */
.nav-indicator::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 42%; left: -55%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.38), transparent);
  transform: skewX(-18deg); pointer-events: none;
}
.nav-indicator.sheen::after { animation: sheenSweep 720ms var(--ease-out-quart); }
@keyframes sheenSweep { from { left: -55%; } to { left: 115%; } }
/* الوميض مخصص فقط للاستقرار — يُضاف صنف .sheen بعد انتهاء الحركة في JS،
   لذا لا يظهر أي وميض أثناء انزلاق المؤشر. هذا السطر يضمن ذلك حتى لو
   أُضيف .sheen بالنقر السريع قبل استقرار المحرك. */
.nav-indicator.is-moving::after { animation: none; opacity: 0; }

body.theme-light .nav-indicator {
  background:
    linear-gradient(160deg, rgba(255,255,255,0.85), rgba(255,255,255,0.4) 46%, rgba(255,255,255,0.6)),
    linear-gradient(135deg, rgba(31, 122, 90, 0.20), rgba(18, 131, 127, 0.10));
  border-color: rgba(31, 122, 90, 0.25);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 1),
    inset 0 -1px 2px rgba(20, 51, 58, 0.10),
    0 6px 16px rgba(20, 51, 58, 0.16),
    0 0 18px rgba(31, 122, 90, 0.14);
}

.nav-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none;
  color: var(--text-dim); font-size: calc(var(--font-size) * 0.5); cursor: pointer; transition: color 0.3s, background 0.3s; position: relative; z-index: 2; height: 100%; overflow: hidden; border-radius: 30px;
}
.nav-tab.active { color: var(--accent); font-weight: bold; }
body.theme-light .nav-tab.active { color: var(--accent); }
.nav-tab .nav-icon { font-size: calc(var(--font-size) * 0.7); transition: transform 0.4s cubic-bezier(0.5, 1.5, 0.4, 1); pointer-events: none; }
.nav-tab.active .nav-icon { transform: translateY(-3px) scale(1.15); filter: drop-shadow(0 4px 6px rgba(62, 207, 158, 0.5)); }
body.theme-light .nav-tab.active .nav-icon { filter: drop-shadow(0 4px 6px rgba(31, 122, 90, 0.35)); }
.nav-tab .nav-text { pointer-events: none; transition: color 0.3s; }

/* ================== انتقالات الشاشات الملساء ================== */
.screen { display: none; width: 100%; max-width: 680px; margin: 0 auto; padding: 16px; }
/* fill-mode: backwards فقط — كلاهما (both) يُبقي transform النهائي مُطبّقاً للأبد،
   مما يُنشئ containing block للعناصر الثابتة (position: fixed) فلا تلتصق بحافة الشاشة */
.screen.active { display: block; animation: depthIn 360ms var(--ease-out-quart) backwards; }
.screen.slide-left { display: block; animation: slideInLeft 380ms var(--ease-out-quart) backwards; }
.screen.slide-right { display: block; animation: slideInRight 380ms var(--ease-out-quart) backwards; }
#screen-tasbih.active, #screen-tasbih.slide-left, #screen-tasbih.slide-right { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - var(--header-h) - 100px); }

.skeleton { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 30%, var(--surface) 60%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmerWave 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; border-radius: 8px; position: relative; overflow: hidden; }
.skeleton::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%); animation: shimmerWave 2s linear infinite; pointer-events: none; }
.sk-card { height: 80px; width: 100%; margin-bottom: 12px; }
.sk-text { height: 20px; width: 100%; margin-bottom: 10px; border-radius: 4px; }
.sk-text.short { width: 60%; }

/* ================= البحث والقرآن ================= */
.search-wrapper { position: relative; margin-bottom: 16px; }
#search-bar { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 40px 12px 16px; color: var(--text); font-size: calc(var(--font-size) * 0.65); outline: none; transition: border-color 0.3s, box-shadow 0.3s, font-size 0.3s; }
#search-bar:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-dim); }
#clear-search { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) scale(0.7); background: none; border: none; color: var(--text-dim); font-size: calc(var(--font-size) * 0.7); cursor: pointer; display: none; padding: 5px; border-radius: 50%; transition: transform 280ms var(--ease-spring-snap), color 240ms var(--ease-out-quart), background 240ms var(--ease-out-quart); }
#clear-search:hover { color: var(--accent); background: var(--accent-dim); }
#clear-search:active { transform: translateY(-50%) scale(0.85); }
.highlight { color: var(--accent); font-weight: bold; background: var(--accent-dim); padding: 0 2px; border-radius: 4px; }

.surah-row { background: var(--surface); border: 1px solid var(--border); border-right: 3px solid transparent; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
.surah-row:active { transform: scale(0.98); }
.surah-row:hover { border-right-color: var(--accent); }
.surah-num { width: 36px; height: 36px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--font-size) * 0.5); color: var(--accent); flex-shrink: 0; transition: background 0.3s, color 0.3s; }
body.theme-light .surah-num { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.surah-info { flex: 1; }
.surah-name { font-size: calc(var(--font-size) * 0.7); font-weight: 700; color: var(--text); transition: font-size 0.3s; }
.surah-meta { font-size: calc(var(--font-size) * 0.5); color: var(--text-dim); transition: font-size 0.3s; }

.surah-header-card { background: var(--accent-grad); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; text-align: center; box-shadow: 0 4px 15px var(--accent-dim); position: relative; }
body.theme-light .surah-header-card { box-shadow: 0 4px 15px rgba(31, 122, 90, 0.12); }
.surah-h-name { font-size: calc(var(--font-size)); font-weight: 700; color: var(--color-on-accent); transition: font-size 0.3s, color 0.3s; }
body.theme-light .surah-h-name { color: var(--color-on-accent); }
.surah-h-meta { font-size: calc(var(--font-size) * 0.5); color: rgba(244, 241, 232, 0.85); margin-top: 4px; transition: font-size 0.3s, color 0.3s; }
.bookmark-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.2); border: none; color: var(--color-on-accent); font-size: calc(var(--font-size) * 0.77); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
body.theme-light .bookmark-btn { background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.4); color: var(--color-on-accent); }
.bookmark-btn:active { transform: scale(0.8); }

.mushaf-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; margin-bottom: 16px; font-family: 'Amiri Quran', 'Amiri', serif; font-size: var(--mushaf-size); line-height: var(--mushaf-lh); text-align: right; color: var(--text); direction: rtl; word-spacing: 0.04em; transition: background 0.4s, color 0.4s, font-size 0.3s, line-height 0.3s; }

.ayah-separator { color: var(--accent); font-family: Tahoma, sans-serif; font-size: 0.62em; margin: 0 6px; font-weight: bold; vertical-align: middle; }
.bismillah { text-align: center; font-family: 'Amiri Quran', 'Amiri', serif; font-size: calc(var(--mushaf-size) * 1.08); color: var(--accent); padding: 14px 10px 22px 10px; line-height: var(--mushaf-lh); transition: font-size 0.3s; }

/* display غير قابل للتحريك؛ نستخدم visibility + opacity للحصول على تلاشٍ ناعم */
#resume-fab { position: fixed; bottom: calc(var(--nav-clearance-safe) + 12px); right: 20px; background: var(--accent-grad); color: var(--color-on-accent); border: none; border-radius: 30px; padding: 12px 20px; font-weight: bold; font-size: calc(var(--font-size) * 0.54); box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; z-index: 90; display: flex; align-items: center; gap: 8px; visibility: hidden; opacity: 0; transform: translateY(20px) scale(0.9); pointer-events: none; transition: visibility 0s linear 320ms, transform 380ms var(--ease-spring-snap), opacity 320ms var(--ease-out-quart), background 320ms var(--ease-out-quart), box-shadow 320ms var(--ease-out-quart); }
body.theme-light #resume-fab { box-shadow: 0 4px 15px rgba(31, 122, 90, 0.3); }
#resume-fab:active { transform: scale(0.95); }
#resume-fab.visible { visibility: visible; opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; transition: visibility 0s linear 0s, transform 380ms var(--ease-spring-snap), opacity 320ms var(--ease-out-quart), background 320ms var(--ease-out-quart), box-shadow 320ms var(--ease-out-quart); animation: fabSpringIn 480ms var(--ease-spring-snap) backwards; }
@keyframes fabSpringIn { 0% { opacity: 0; transform: translateY(24px) scale(0.85); } 60% { opacity: 1; transform: translateY(-3px) scale(1.04); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

/* ================= الحلقات الدائرية وتأثير النبض ================= */

/* ================= الختمة ================= */

.k-label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: calc(var(--font-size) * 0.55); transition: font-size 0.3s; }

.btn-scale { width: 100%; background: var(--accent-grad); color: var(--color-on-accent); font-weight: bold; font-size: calc(var(--font-size) * 0.65); padding: 14px; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, font-size 0.3s; }

.k-dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }

.k-wird-container { display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); border-radius: 8px; padding: 12px; width: 90%; transition: background 0.4s; }
.k-wird-badge { display: flex; flex-direction: column; align-items: center; min-width: fit-content; white-space: nowrap; }
.k-wird-badge span { font-size: calc(var(--font-size) * 0.85); font-weight: bold; color: var(--accent); transition: font-size 0.3s; }
.k-wird-badge small { font-size: calc(var(--font-size) * 0.45); color: var(--text-dim); margin-bottom: 4px; transition: font-size 0.3s; }
.k-wird-arrow { color: var(--accent); font-size: calc(var(--font-size) * 0.8); font-weight: bold; transition: font-size 0.3s; }

.khatmah-controls { position: fixed; bottom: calc(var(--nav-clearance-safe) + 12px); left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 680px; display: flex; gap: 8px; background: rgba(16, 51, 63, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px 16px; border-radius: 12px; z-index: 50; transition: bottom 380ms var(--ease-spring), transform 380ms var(--ease-spring), opacity 0.4s, background 0.4s; }
body.theme-light .khatmah-controls { background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border); }
/* عندما يكون شريط التنقل مخفياً، تنزل الأزرار لأسفل مباشرة */
#nav.nav-hidden ~ .khatmah-controls { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.khatmah-controls.controls-hidden { transform: translateX(-50%) translateY(150px); opacity: 0; pointer-events: none; }
/* مساحة سفلية إضافية في قارئ الختمة حتى لا تغطي الأزرار آخر الآيات */
#screen-khatmah-read { padding-bottom: calc(var(--nav-clearance-safe) + 98px); }
.k-ctrl-btn { flex: 1; background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: calc(var(--font-size) * 0.55); transition: transform 0.2s, font-size 0.3s, background 0.4s, color 0.4s; }
.k-ctrl-btn:active { transform: scale(0.95); }
.k-ctrl-btn.primary { background: var(--success); color: #fff; border-color: var(--success); flex: 2; }
.k-ctrl-btn:disabled { opacity: 0.4; pointer-events: none; }

/* ================= الأذكار ================= */
.quick-nav-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.quick-nav-card { background: var(--accent-grad); border-radius: var(--radius); padding: 16px 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.2s; }

.quick-nav-label { font-size: calc(var(--font-size) * 0.6); font-weight: 700; color: var(--color-on-accent); display: block; transition: font-size 0.3s, color 0.3s; }

.athkar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.athkar-cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: transform 0.2s, border-color 0.2s, background 0.4s; }

.thikr-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 46px 20px 20px; margin-bottom: 16px; transition: background 0.4s, border-color 0.4s; position: relative; }

/* زر نسخ نص الذكر/الدعاء */
.copy-btn { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px; font-size: calc(var(--font-size) * 0.45); font-family: inherit; font-weight: bold; cursor: pointer; transition: transform 200ms var(--ease-spring-snap), color 200ms var(--ease-out-quart), background 200ms var(--ease-out-quart), border-color 200ms var(--ease-out-quart); }
.copy-btn:active { transform: scale(0.92); }

.thikr-text { font-family: 'Amiri Quran', serif; font-size: calc(var(--font-size) * 1.15); line-height: calc(var(--line-height) * 1.1); color: var(--text); text-align: right; margin-bottom: 12px; transition: font-size 0.3s; white-space: pre-line; }

.thikr-tap-btn { width: 100%; min-height: 56px; background: var(--surface-2); border: 2px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: calc(var(--font-size) * 0.7); cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), font-size 0.3s; }
.thikr-tap-btn:active { transform: scale(0.96); }
.thikr-tap-btn.done { background: #0f3a26; border-color: var(--success); color: var(--success); transform: scale(1); }
body.theme-light .thikr-tap-btn.done { background: #e6f4ea; color: var(--success); border-color: var(--success); }

.dua-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 46px 18px 18px; margin-bottom: 14px; transition: background 0.4s, border-color 0.4s; position: relative; }
.dua-occasion { font-size: calc(var(--font-size) * 0.6); font-weight: 700; color: var(--accent); margin-bottom: 10px; transition: font-size 0.3s; }
.dua-text { font-size: calc(var(--font-size) * 0.85); line-height: var(--line-height); color: var(--text); text-align: justify; transition: font-size 0.3s; }

/* ================= ترويسة القسم ================= */
.section-heading { display: block; color: var(--accent); font-weight: 700; margin: 18px 4px 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

/* ================= السنن والمناسبات ================= */
.occasion-card { background: var(--surface); border: 1px solid var(--border); border-right: 4px solid var(--accent); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: background 0.4s, border-color 0.4s, box-shadow 0.4s; }

.occasion-sunnah-item { font-size: calc(var(--font-size) * 0.7); line-height: 2; color: var(--text); padding: 10px 0; border-bottom: 1px solid var(--border); transition: font-size 0.3s, color 0.3s; font-family: inherit; }
.occasion-sunnah-item:last-child { border-bottom: none; }
.occasion-note { font-size: calc(var(--font-size) * 0.55); color: var(--text-dim); background: var(--surface-2); border-radius: 8px; padding: 12px; margin-top: 16px; line-height: 1.8; transition: font-size 0.3s, background 0.4s; font-family: inherit; }

/* ================= السبحة ================= */
.tasbih-laps { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center; }
.tasbih-lap-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; transition: background 0.3s; }

#tasbih-circle-wrap { position: relative; width: 280px; height: 280px; margin: 0 auto; }
.tasbih-bead { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); transform: translate(-50%, -50%); transition: 0.2s; }
.tasbih-bead.filled { background: var(--accent); border-color: var(--accent); transform: translate(-50%, -50%) scale(1.3); }
#tasbih-tap-btn { position: absolute; inset: 34px; border-radius: 50%; background: var(--accent-grad); border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.1s; }

#tasbih-tap-btn:active { transform: scale(0.92); }
#tasbih-count-num { font-size: calc(var(--font-size) * 1.8); font-weight: 700; color: var(--color-on-accent); transition: font-size 0.3s, color 0.4s; }
body.theme-light #tasbih-count-num { color: var(--color-on-accent); }
.tasbih-complete-banner { background: linear-gradient(135deg, rgba(62, 207, 158, 0.14), rgba(70, 200, 214, 0.07)); border: 1px solid var(--accent); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--accent); margin-bottom: 20px; display: none; width: 100%; max-width: 320px; }
.tasbih-complete-banner.active { display: block; }

#occasion-overlay { position: fixed; inset: 0; background: rgba(5,6,10,0.72); z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
#occasion-overlay.active { display: flex; }
#occasion-modal { background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); width: 100%; max-width: 400px; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); animation: fadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.occasion-modal-icon { font-size: calc(var(--font-size) * 1.3); text-align: center; margin-bottom: 8px; }
.occasion-modal-title { font-size: calc(var(--font-size) * 0.73); font-weight: 700; color: var(--accent); text-align: center; margin-bottom: 14px; }
.occasion-modal-item { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: calc(var(--font-size) * 0.7); line-height: 1.9; color: var(--text); transition: font-size 0.3s, background 0.4s; font-family: inherit; }

#splash-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; transition: opacity 500ms var(--ease-out-quart), transform 500ms var(--ease-out-quart), background 480ms var(--ease-out-quart); }

.splash-title { color: var(--accent); font-size: calc(var(--font-size) * 0.92); margin-bottom: 10px; font-weight: bold; }
.splash-user { color: var(--text-dim); font-size: calc(var(--font-size) * 0.62); }

/* ==================== Universal Liquid Glass Effect ==================== */
.surah-row, .quick-nav-card, .athkar-cat-card, .thikr-tap-btn, .btn-scale, .bookmark-btn, .k-ctrl-btn, #resume-fab, #tasbih-tap-btn, .header-btn {
  transition: transform 320ms var(--ease-out-quart), background 320ms var(--ease-out-quart), border-color 320ms var(--ease-out-quart), box-shadow 320ms var(--ease-out-quart), color 320ms var(--ease-out-quart) !important;
}
.surah-row:active, .quick-nav-card:active, .athkar-cat-card:active, .thikr-tap-btn:active, .btn-scale:active, .bookmark-btn:active, .k-ctrl-btn:active, #resume-fab:active, #tasbih-tap-btn:active, .header-btn:active {

}

/* ==================== Custom Dialog Styles ==================== */
#custom-dialog-overlay { position: fixed; inset: 0; background: rgba(5,6,10,0.72); z-index: 99999; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }

/* ==================== شريط التلاوة الصوتية ==================== */
#audio-bar { position: fixed; bottom: calc(var(--nav-clearance-safe) + 10px); right: 20px; z-index: 95; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--accent); border-radius: 30px; padding: 8px 8px 8px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); transform: translateX(calc(100% + 30px)); opacity: 0; transition: bottom 380ms var(--ease-spring), transform 420ms var(--ease-spring), opacity 320ms; max-width: calc(100vw - 40px); }

#audio-bar button { background: var(--accent-deep); color: var(--color-on-accent); border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: calc(var(--font-size) * 0.6); cursor: pointer; flex-shrink: 0; }
#audio-bar #audio-close { background: var(--surface-2); color: var(--text-dim); }
#audio-bar.playing #audio-play-btn { animation: audioPulse 1.8s ease-in-out infinite; }
@keyframes audioPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-dim); } 50% { box-shadow: 0 0 0 10px transparent; } }
.audio-play { position: absolute; top: 10px; right: 10px; left: auto; background: rgba(255,255,255,0.2); border: none; color: var(--color-on-accent); font-size: calc(var(--font-size) * 0.6); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }

/* ==================== شاشة المرجعيات ==================== */
.bm-remove { position: absolute; top: 50%; left: 10px; transform: translateY(-50%); background: var(--surface-2); color: var(--text-dim); border: none; border-radius: 50%; width: 30px; height: 30px; font-size: calc(var(--font-size) * 0.55); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 180ms var(--ease-spring-snap), color 180ms; }

/* ==================== شاشة الإحصائيات ==================== */
.stats-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 14px; text-align: center; transition: transform 280ms var(--ease-out-quart), border-color 280ms; }
.stat-card:active { transform: scale(0.97); }
.stat-value { font-size: calc(var(--font-size) * 1.2); font-weight: 800; color: var(--accent); font-family: Tahoma, sans-serif; }
.stat-label { font-size: calc(var(--font-size) * 0.48); color: var(--text-dim); margin-top: 6px; }
.stats-chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 16px; }
.stats-bars { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; height: 130px; margin-top: 10px; }
.stats-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
.stats-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.stats-bar { width: 70%; max-width: 34px; background: linear-gradient(180deg, var(--accent), var(--accent-deep)); border-radius: 8px 8px 4px 4px; transition: height 600ms var(--ease-spring); min-height: 4px; position: relative; }

/* ==================== شاشة الإعدادات ==================== */
.settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
.settings-label { font-size: calc(var(--font-size) * 0.58); font-weight: bold; color: var(--text); margin-bottom: 12px; }

.settings-chip.active { background: var(--accent-deep); color: var(--color-on-accent); border-color: var(--accent-deep); transform: scale(1.04); }

.settings-toggle .settings-toggle-knob { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--text-dim); transition: transform 280ms var(--ease-spring-snap), background 240ms; }

/* ==================== حلقة التقدم بحركة زنبركية ==================== */
.circle-path { transition: stroke-dasharray 900ms var(--ease-spring), stroke 0.4s; }

/* ==================== زر إضافي في الشريط العلوي للمرجعيات ==================== */
#header { }

/* ==================== تكييف شريط التنقل مع المقاسات والاتجاهات ==================== */

/* ملاحظة مهمة: --nav-gap يُكتب كـ inline style على <html> من syncNavSafeArea()،
   والـ inline style يتغلّب على قواعد :root داخل @media. لذلك لا نضبط --nav-gap
   هنا إطلاقاً — القيمة تُدار من JS وحدها (المتغير navGapBase أدناه).
   نضبط هنا --nav-h و --nav-drop فقط، وكلاهما لا يلمسه JS. */

/* شاشات قصيرة (هواتف صغيرة أو عرض أفقي): نصغّر الشريط والفراغ معاً

<script>

const MUAWIDHAT = "المعوذات (٣ مرات):\nبِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.\n\nبِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.\n\nبِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ.";
const SAYYID_ALISTIGHFAR = "سيد الاستغفار:\nاللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.";

const ATHKAR=[
{name:"أذكار الصباح",icon:"🌅",items:[
  {text:AYAT_AL_KURSI,count:1},
  {text:MUAWIDHAT,count:3},

  {text:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.",count:1},
  {text:SAYYID_ALISTIGHFAR,count:1},
  {text:"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.",count:4},

  {text:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.",count:7},
  {text:"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ.",count:100},
  {text:"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ.",count:10}
]},
{name:"أذكار المساء",icon:"🌙",items:[
  {text:AYAT_AL_KURSI,count:1},
  {text:MUAWIDHAT,count:3},
  {text:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ، وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.",count:1},
  {text:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ.",count:1},
  {text:SAYYID_ALISTIGHFAR,count:1},

const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

function initHijri() {
  try {
    const fmt = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', { year: 'numeric', month: 'numeric', day: 'numeric' });
    const test = fmt.formatToParts(new Date());
    if (test.some(p => p.type === 'year' && parseInt(p.value)>1400)) { hijriFormatter = fmt; hijriEngineAvailable = true; }
  } catch(e) {}
}

function getHijriDate(date) {
  if (!hijriFormatter) return null;
  try {
    const parts = hijriFormatter.formatToParts(date);
    const d = parseInt(parts.find(p=>p.type==='day').value);
    const m = parseInt(parts.find(p=>p.type==='month').value);
    const y = parseInt(parts.find(p=>p.type==='year').value);
    return { day: d, month: m, year: y };
  } catch(e) { return null; }
}

function getActiveOccasionKeys(hijri, gregorianDayOfWeek) {
  const keys = []; const { day, month } = hijri;
  if (gregorianDayOfWeek === 0) keys.push('pre_monday');
  if (gregorianDayOfWeek === 3) keys.push('pre_thursday');
  // مساء الخميس: تذكير بسنن الجمعة (يوم الجمعة هو العيد الأسبوعي)
  if (gregorianDayOfWeek === 4) keys.push('pre_friday');
  if (day === 12) keys.push('pre_white_days');
  const FRIDAY = 5, MONDAY = 1, THURSDAY = 4;
  if (gregorianDayOfWeek === FRIDAY) keys.push('friday');
  if (gregorianDayOfWeek === MONDAY || gregorianDayOfWeek === THURSDAY) keys.push('monday_thursday');
  if (day >= 13 && day <= 15) keys.push('white_days');
  if (month === 9) { if (day >= 20) keys.push('ramadan_last10'); else keys.push('ramadan'); }
  if (month === 10 && day === 1) keys.push('eid_fitr');
  if (month === 12) { if (day >= 1 && day <= 9) keys.push('dhulhijjah_10'); if (day === 10) keys.push('eid_adha'); }
  if (month === 1) { if (day === 1) keys.push('new_hijri_year'); if (day === 9 || day === 10) keys.push('ashura'); }
  if (month === 8 && day === 15) keys.push('mid_shaaban');
  if (month === 7 && day === 27) keys.push('isra_miraj');
  return keys;
}

function todayDateKey(date) { return `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`; }
function getCurrentPeriod(date) {
  const h = date.getHours();
  if (h >= 4 && h < 12) return 'fajr_morning';
  if (h >= 12 && h < 15) return 'dhuhr';
  if (h >= 15 && h < 18) return 'asr';
  if (h >= 18 && h < 20) return 'maghrib';
  return 'isha_night';
}

/* ==================== تطبيع النصوص العربية وإزالة البسملة ==================== */
/* المشكلة: واجهة الـ API تُرجع تشكيل البسملة بترتيب غير قياسي (الشدّة U+0651 قبل
   الفتحة U+064E أحياناً)، وكذلك اختلاف أشكال الألف والمدّ والتطويل بين السور.
   لذلك أي مطابقة نصية حرفية للبسملة ستفشل. الحل: تطبيع موحّد يزيل التشكيل
   ويوحّد الألف/الياء ثم مقارنة الكلمات الأربع الأولى. */
function _normArabic(s) {
  return (s || '')
    .normalize('NFKC')                       // يوحّد ترتيب الحركات المتتابعة (الفتحة/الشدّة)
    .replace(/[\u064B-\u0652\u0670\u0640\u06D6-\u06ED]/g, '') // إزالة التشكيل + المدّ U+0670 + التطويل U+0640 + علامات المصحف
    .replace(/[أإآٱ]/g, 'ا')                 // توحيد كل أشكال الألف
    .replace(/ى/g, 'ي')                      // توحيد الياء/الألف المقصورة
    .replace(/\s+/g, ' ')
    .trim();
}
// الصورة المرجعية للبسملة بعد التطبيع (بسم الله الرحمن الرحيم)
const BISMILLAH_NORMALIZED = _normArabic('بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ');

// تزيل البسملة من بداية نص الآية الأولى في السورة (إن وُجدت) مع إبقاء باقي
// كلمات الآية وتشكيلها كما هي. تُستثنى الفاتحة (البسملة فيها آية مستقلة)
// والتوبة (لا بسملة) — ويتم ذلك في أماكن الاستدعاء.
function stripBismillah(text) {
  if (!text) return text;
  if (!_normArabic(text).startsWith(BISMILLAH_NORMALIZED)) return text;
  // البسملة أربع كلمات دائماً؛ نقطفها من النص الأصلي لنبقى على تشكيل الآية سليماً
  const words = text.trim().split(/\s+/);
  if (words.length <= 4) return '';
  return words.slice(4).join(' ').trim();
}

/* ==================== Motion Engine ==================== */
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const Motion = {
  // Stagger-in: takes a container element, staggers its direct children with a CSS class
  staggerIn(container, childSelector = ':scope > *', baseDelay = 0) {
    if (!container) return;
    if (prefersReducedMotion) { container.classList.add('mounted'); return; }
    container.setAttribute('data-stagger', '');
    const children = container.querySelectorAll(childSelector);
    children.forEach((child, i) => {
      const delay = baseDelay + Math.min(i, 14) * 50;
      child.style.setProperty('--reveal-delay', `${delay}ms`);
    });
    requestAnimationFrame(() => {
      requestAnimationFrame(() => container.classList.add('mounted'));
    });
  },

  // FLIP animation: smoothly transition elements from old to new positions
  flipAnimate(container, childSelector = ':scope > *', duration = 380) {
    if (!container || prefersReducedMotion) return;
    const children = container.querySelectorAll(childSelector);
    const firstRects = new Map();
    children.forEach(c => firstRects.set(c, c.getBoundingClientRect()));
    return () => {
      children.forEach(c => {
        const last = c.getBoundingClientRect();
        const first = firstRects.get(c);
        if (!first) return;
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (dx === 0 && dy === 0) return;
        c.style.transition = 'none';
        c.style.transform = `translate(${dx}px, ${dy}px)`;
        c.classList.add('flip-anim');
        requestAnimationFrame(() => {
          c.style.transform = '';
          setTimeout(() => c.classList.remove('flip-anim'), duration + 50);
        });
      });
    };
  },

  // Smooth count-up animation: animates a number from current to target
  animateNumber(el, from, to, duration = 600) {
    if (!el || prefersReducedMotion) { if (el) el.textContent = toArabicNum(to); return; }
    const start = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3); // easeOutCubic
    el.classList.add('count-anim');
    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const v = Math.round(from + (to - from) * ease(t));
      el.textContent = toArabicNum(v);
      if (t < 1) requestAnimationFrame(frame);
      else {
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
      }
    }
    requestAnimationFrame(frame);
  },

  // Burst particles from a target element
  burst(target, count = 8, color = 'var(--accent)') {
    if (!target || prefersReducedMotion) return;
    const rect = target.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'burst-particle';
      const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
      const dist = 30 + Math.random() * 40;
      p.style.left = `${cx}px`;
      p.style.top = `${cy}px`;
      p.style.setProperty('--bx', `${Math.cos(angle) * dist}px`);
      p.style.setProperty('--by', `${Math.sin(angle) * dist}px`);
      p.style.background = color;
      p.style.position = 'fixed';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 750);
    }
  },

  // Confetti burst
  confetti(count = 60) {
    if (prefersReducedMotion) return;
    // حدود أصغر على الشاشات الصغيرة للأداء
    if (window.innerWidth < 500) count = Math.min(count, 50);
    const colors = ['#3ecf9e', '#46c8d6', '#f3f0e7', '#4fd1a5', '#2aa8a8', '#8fe3c0'];
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = `${Math.random() * 100}vw`;
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.setProperty('--dx', `${(Math.random() - 0.5) * 200}px`);
      piece.style.setProperty('--dr', `${360 + Math.random() * 720}deg`);
      piece.style.animationDelay = `${Math.random() * 200}ms`;
      piece.style.animationDuration = `${1400 + Math.random() * 800}ms`;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 2400);
    }
  },

  // Floating "+1" label
  floater(target, text = '+1', color = 'var(--accent)') {
    if (!target || prefersReducedMotion) return;
    const rect = target.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'floater';
    f.textContent = text;
    f.style.left = `${rect.left + rect.width / 2}px`;
    f.style.top = `${rect.top + rect.height / 2}px`;
    f.style.color = color;
    f.style.position = 'fixed';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 950);
  },

  // Surge ring (success feedback around target)
  surgeRing(target) {
    if (!target || prefersReducedMotion) return;
    const ring = document.createElement('div');
    ring.className = 'surge-ring';
    target.appendChild(ring);
    setTimeout(() => ring.remove(), 760);
  },

  // Magnetic hover effect (subtle): element follows cursor within bounds
  magnetic(target, strength = 0.2) {
    if (!target || prefersReducedMotion) return () => {};
    target.setAttribute('data-magnetic', '');
    const onMove = e => {
      const rect = target.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      target.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
    };
    const onLeave = () => { target.style.transform = ''; };
    target.addEventListener('mousemove', onMove);
    target.addEventListener('mouseleave', onLeave);
    return () => {
      target.removeEventListener('mousemove', onMove);
      target.removeEventListener('mouseleave', onLeave);
    };
  },

  // Theme crossfade: briefly enables a global transition
  themeCrossfade() {
    if (prefersReducedMotion) return;
    document.documentElement.classList.add('theme-transitioning');
    setTimeout(() => document.documentElement.classList.remove('theme-transitioning'), 500);
  },

  // Header flash on theme switch
  headerFlash() {
    const h = document.getElementById('header');
    if (!h || prefersReducedMotion) return;
    h.classList.remove('theme-flash');
    void h.offsetWidth;
    h.classList.add('theme-flash');
    setTimeout(() => h.classList.remove('theme-flash'), 650);
  },

  // Header parallax on scroll
  bindHeaderParallax(scrollEl) {
    if (!scrollEl || prefersReducedMotion) return () => {};
    const h = document.getElementById('header');
    if (!h) return () => {};
    let raf = null;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const sy = scrollEl.scrollTop;
        const offset = Math.max(-10, Math.min(0, -sy * 0.15));
        h.style.transform = `translateY(${offset}px)`;
        const shadow = Math.min(0.5, sy / 200);
        h.style.boxShadow = `0 2px 15px rgba(0,0,0,${0.3 + shadow * 0.2})`;
        raf = null;
      });
    };
    scrollEl.addEventListener('scroll', onScroll, { passive: true });
    return () => scrollEl.removeEventListener('scroll', onScroll);
  }
};

/* ==================== محرك الزنبرك للمؤشر الزجاجي (Spring Physics) ==================== */
/* محاكاة فيزيائية حقيقية (Mass-Spring-Damper) بحركة طبيعية غير خطية،
   بدلاً من انتقالات CSS الثابتة. تدعم استمرار السرعة عند السحب والإفلات. */
const navIndicatorEl = document.getElementById('nav-indicator');
const navSpring = {
  x: 0, w: 0, vx: 0, vw: 0, targetX: 0, targetW: 0,
  k: 190, c: 19,            /* ثابت الصلابة + التخميد ← حركة زنبركية ناعمة مع تردد بسيط */
  raf: null, running: false, lastT: 0, traveled: 0
};

function applyNavIndicator(x, w, stretchX, squashY) {
  navIndicatorEl.style.width = `${w}px`;
  navIndicatorEl.style.transform = `translateX(${x}px) scaleX(${stretchX}) scaleY(${squashY})`;
}

function snapNavIndicator() {
  const activeTab = document.querySelector('.nav-tab.active');
  if (!activeTab) return;
  if (navSpring.raf) { cancelAnimationFrame(navSpring.raf); navSpring.running = false; }
  navSpring.x = navSpring.targetX = activeTab.offsetLeft;
  navSpring.w = navSpring.targetW = activeTab.offsetWidth;
  navSpring.vx = navSpring.vw = 0;
  applyNavIndicator(navSpring.x, navSpring.w, 1, 1);
}

function navSpringStep(now) {
  const s = navSpring;
  if (!s.lastT) s.lastT = now;
  let dt = (now - s.lastT) / 1000;
  s.lastT = now;
  if (dt <= 0) { s.raf = requestAnimationFrame(navSpringStep); return; }
  dt = Math.min(dt, 1 / 30); // منع الانفجار العددي عند الرجوع للتبويب

  // خطوات فرعية لضمان الاستقرار مع ثابت صلابة عالٍ
  const sub = 4, h = dt / sub;
  for (let i = 0; i < sub; i++) {
    s.vx += (-s.k * (s.x - s.targetX) - s.c * s.vx) * h;
    s.vw += (-s.k * (s.w - s.targetW) - s.c * s.vw) * h;
    s.x += s.vx * h;
    s.w += s.vw * h;
  }

  // التمدد/الانضغاط حسب السرعة ← إحساس "السائل الزجاجي"
  const speed = Math.abs(s.vx);
  const stretchX = 1 + Math.min(speed / 900, 0.16);
  const squashY = 1 - Math.min(speed / 1400, 0.10);
  applyNavIndicator(s.x, s.w, stretchX, squashY);

  // شرط الاستقرار: وصول للهدف بسرعة شبه صفرية
  if (Math.abs(s.x - s.targetX) < 0.3 && Math.abs(s.vx) < 3 && Math.abs(s.w - s.targetW) < 0.5) {
    s.x = s.targetX; s.w = s.targetW; s.vx = s.vw = 0;
    applyNavIndicator(s.x, s.w, 1, 1);
    s.running = false; s.lastT = 0;
    // وميض زجاجي خفيف عند الوصول إذا تحرك المؤشر فعلاً
    if (s.traveled > 8) {
      navIndicatorEl.classList.remove('sheen');
      void navIndicatorEl.offsetWidth;
      navIndicatorEl.classList.add('sheen');
    }
    s.traveled = 0;
    return;
  }
  s.raf = requestAnimationFrame(navSpringStep);
}

function setNavIndicator() {
  const activeTab = document.querySelector('.nav-tab.active');
  if (!activeTab || !navIndicatorEl) return;
  navSpring.targetX = activeTab.offsetLeft;
  navSpring.targetW = activeTab.offsetWidth;
  navSpring.traveled = Math.max(navSpring.traveled, Math.abs(navSpring.targetX - navSpring.x));

  if (prefersReducedMotion) {
    if (navSpring.raf) { cancelAnimationFrame(navSpring.raf); navSpring.running = false; }
    navSpring.x = navSpring.targetX; navSpring.w = navSpring.targetW; navSpring.vx = navSpring.vw = 0;
    applyNavIndicator(navSpring.x, navSpring.w, 1, 1);
    return;
  }
  if (!navSpring.running) {
    navSpring.running = true;
    navSpring.lastT = 0;
    navSpring.raf = requestAnimationFrame(navSpringStep);
  }
}

function createRipple(e) {
  const btn = e.currentTarget; if (!btn || btn.querySelector('.ripple')) return;
  const circle = document.createElement("span");
  const d = Math.max(btn.clientWidth, btn.clientHeight) * 1.2; const r = d / 2;
  circle.style.width = circle.style.height = `${d}px`;
  const cx = e.clientX || (e.touches && e.touches[0].clientX) || (btn.getBoundingClientRect().left + btn.clientWidth / 2);
  const cy = e.clientY || (e.touches && e.touches[0].clientY) || (btn.getBoundingClientRect().top + btn.clientHeight / 2);
  const rect = btn.getBoundingClientRect();
  circle.style.left = `${cx - rect.left - r}px`; circle.style.top = `${cy - rect.top - r}px`; circle.classList.add("ripple");
  btn.appendChild(circle);
  setTimeout(() => circle.remove(), 600);
}

function switchTab(tabId) {
  const oldI = tabsArray.indexOf(state.currentTab); const newI = tabsArray.indexOf(tabId);
  let anim = 'active'; if (oldI !== -1 && newI !== -1 && oldI !== newI) anim = newI > oldI ? 'slide-left' : 'slide-right';

  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected', 'false');
  });
  const activeTab = document.querySelector(`.nav-tab[data-tab="${tabId}"]`);
  if (activeTab) { activeTab.classList.add('active'); activeTab.setAttribute('aria-selected', 'true'); }
  if (state.currentTab !== tabId) state.previousTab = state.currentTab;
  state.currentTab = tabId;

  if (tabId === 'quran') { showScreen('surah-list', anim); }
  else if (tabId === 'khatmah') { checkMissedDays(); showScreen('khatmah-main', anim); updateKhatmahUI(); }
  else { showScreen('athkar-list', anim); renderAthkarList(); Motion.staggerIn(document.querySelector('#screen-athkar-list .quick-nav-row')); }
  saveState(); setNavIndicator(); checkBookmarkFAB();
}

let swipeStartX = 0; let swipeStartY = 0;
function handleSwipeStart(x, y) { swipeStartX = x; swipeStartY = y; }
function handleSwipeEnd(x, y) {
  const dx = x - swipeStartX; const dy = y - swipeStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) {
    if (['surah-view', 'thikr-view', 'dua-list', 'tasbih', 'khatmah-read', 'occasion-list'].includes(state.currentScreen)) return;
    const currentIndex = tabsArray.indexOf(state.currentTab);
    if (dx > 0 && currentIndex < tabsArray.length - 1) switchTab(tabsArray[currentIndex + 1]);
    else if (dx < 0 && currentIndex > 0) switchTab(tabsArray[currentIndex - 1]);
  }
}

function bindGesturesAndScroll() {
  const shouldIgnore = e => e.target.closest('select, input, option, textarea');
  contentArea.addEventListener('touchstart', e => { if (shouldIgnore(e)) return; handleSwipeStart(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, {passive: true});
  contentArea.addEventListener('touchend', e => { if (shouldIgnore(e)) return; handleSwipeEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, {passive: true});
  contentArea.addEventListener('mousedown', e => { if (shouldIgnore(e)) return; if(e.button === 0) handleSwipeStart(e.clientX, e.clientY); }, {passive: true});
  contentArea.addEventListener('mouseup', e => { if (shouldIgnore(e)) return; if(e.button === 0) handleSwipeEnd(e.clientX, e.clientY); }, {passive: true});

  // Header parallax
  Motion.bindHeaderParallax(contentArea);

  let lastScrollY = 0;
  contentArea.addEventListener('scroll', () => {
    const sy = contentArea.scrollTop; const maxScroll = contentArea.scrollHeight - contentArea.clientHeight;
    const isAtBottom = sy >= maxScroll - 20;
    const nav = document.getElementById('nav'); const fab = document.getElementById('resume-fab'); const kctrl = document.getElementById('khatmah-controls');
    if (sy > lastScrollY && sy > 50 && !isAtBottom) {
      nav.classList.add('nav-hidden'); if(fab) fab.style.transform = 'translateY(140px) scale(0.85)';
      if(kctrl) kctrl.classList.add('controls-hidden');
    } else {
      nav.classList.remove('nav-hidden'); if(fab) fab.style.transform = '';
      if(kctrl && state.currentScreen === 'khatmah-read') kctrl.classList.remove('controls-hidden');
    }
    lastScrollY = sy;
    if (['surah-view', 'khatmah-read'].includes(state.currentScreen)) { document.getElementById('reading-progress-bar').style.width = (maxScroll > 0 ? (sy / maxScroll) * 100 : 0) + '%'; }
  }, {passive: true});
}

// توحيد نظام المرجعيات: state.bookmark هو *مرجع* لآخر إدخال في BookmarkManager
window.toggleBookmark = function(type) {
  if (type === 'khatmah' && !state.khatmah) return;
  const btn = type === 'surah' ? document.getElementById('btn-bm-surah') : null;
  const id = type === 'surah' ? state.currentSurah.number : state.khatmah.currentPage;
  const name = type === 'surah' ? state.currentSurah.name : `صفحة ${state.khatmah.currentPage}`;
  let willActivate = true;
  if (type === 'surah' && window.BookmarkManager) {
    // مصدر الحقيقة الوحيد للسور: BookmarkManager
    const marked = BookmarkManager.isSurahBookmarked(id);
    if (marked) { BookmarkManager.removeSurahBookmark(id); willActivate = false; }
    else BookmarkManager.addSurahBookmark(id, name);
  }
  // state.bookmark مرجع لآخر إدخال (لزر المتابعة)
  if (willActivate) state.bookmark = { type, id, name };
  else if (state.bookmark && state.bookmark.type === type && state.bookmark.id === id) state.bookmark = null;
  saveState(); updateBookmarkIcon();
  if (btn) {
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    if (willActivate) Motion.burst(btn, 12, 'var(--accent)');
  }
};

async function loadSurahList() {
  try {
    // مهلة 8 ثوانٍ: حتى لا تبقى الهيكلية (skeleton) معلّقة للأبد عند بطء الشبكة
    const controller = new AbortController();

function renderSurahList(list, query = '') {
  document.getElementById('surah-list-container').innerHTML = list.map(s => {
