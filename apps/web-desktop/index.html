<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07161B">
  <title>صدقة جارية — إسلامي</title>
  <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles/shell.css">
    <link rel="stylesheet" href="styles/mushaf.css">
    <link rel="stylesheet" href="styles/sheets.css">
    <link rel="stylesheet" href="styles/tools.css">
</head>
<body data-theme="dark">
  <div id="screen-root" aria-live="polite"></div>

  <!-- Liquid Glass control layer: floating pill bar + separated Search pill -->
  <nav class="glass-tabbar" id="tabbar" aria-label="التنقل الرئيسي">
    <button class="tab-btn" data-tab="today">اليوم</button>
    <button class="tab-btn" data-tab="mushaf">المصحف</button>
    <button class="tab-btn" data-tab="athkar">الأذكار</button>
    <button class="tab-btn" data-tab="tools">الأدوات</button>
  </nav>
  <div class="glass-searchpill" id="searchpill" role="button" tabindex="0" aria-label="بحث شامل"
       title="بحث في القرآن والأذكار والتفاسير">🔍</div>
  <div class="miniplayer" id="miniplayer" role="region" aria-label="مشغل التلاوة"></div>

  <div id="sheet-root"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
