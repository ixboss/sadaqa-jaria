name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# أعلى مستوى: لا صلاحيات للجميع — تُمنح لكل job بحسب حاجته (2026-11 audit:
# كانت contents: write عامة وتغطي job الاختبار المُطلق بـ pull_request أيضاً).
permissions:
  contents: read

jobs:
  test:
    name: Test (PWA E2E + Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Chrome for CDP tests
        run: |
          # chromium-browser على ubuntu-24.04 هو غلاف snap لا يعمل داخل العدّاءات — ثبّت Chrome الحقيقي
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get -f install -y
          echo "E2E_BROWSER=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          /usr/bin/google-chrome --version

      - name: Run unit + E2E suite
        env:
          E2E_BROWSER: ${{ env.E2E_BROWSER }}
        run: |
          # run-all يشغّل خادم الاختبار بنفسه — خادم مزدوج هنا كان يقتل
          # المنفذ الداخلي بـ EADDRINUSE صامتة (audit 2026-11)
          npm test

      - name: v2 engine + parity checks
        run: |
          npm run test:core
          npm run parity:verify

      - name: Build v2 offline assets & Electron deps
        run: |
          npm ci --no-audit --no-fund
          npm run seeds:fetch
          npm run db:build
          npm run fonts:fetch
          npm run audio:fetch
          npm --prefix apps/electron ci --no-audit --no-fund
          # تنزيل ثنائي electron كان يتخطى بصمت على عدّاءات ubuntu الجديدة
          # (postinstall لا يعمل — 312 حزمة في 7 ثوانٍ بلا تنزيل) فبقي البروب
          # يتخطى نفسه بلا ثنائي طوال تاريخ CI — أعد التشغيل صراحةً وافحص
          # الوجود هنا بدل فشل غامض لاحقاً (audit 2026-11)
          if [ ! -f apps/electron/node_modules/electron/dist/electron ]; then
            npm --prefix apps/electron rebuild electron --no-audit --no-fund
          fi
          if [ ! -f apps/electron/node_modules/electron/dist/electron ]; then
            (cd apps/electron && node node_modules/electron/install.js)
          fi
          test -f apps/electron/node_modules/electron/dist/electron || { echo "::error::electron binary missing after install"; exit 1; }

      - name: Run v2 browser E2E & Electron smoke probe
        env:
          E2E_BROWSER: ${{ env.E2E_BROWSER }}
        run: |
          npm run test:v2
          npm run test:v2:p4
          # مجموعات CHAT-1 (zoom/rail/pageturn) تقلع تطبيق v2 — تحتاج sadaqa.db
          # المبني في الخطوة السابقة، لذا تُشغَّل هنا لا داخل npm test المبكر
          npm run test:v2:fixes
          # SADAQA_REQUIRE_ELECTRON=1: تبعيات Electron مثبتة في الخطوة السابقة —
          # غياب الملف الثنائي هنا تراجعٌ حقيقي يجب أن يُفشل CI (audit 2026-11)
          SADAQA_REQUIRE_ELECTRON=1 xvfb-run -a npm run test:electron

  build-android:
    name: Build Android APK
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install node deps & rebuild offline assets
        run: |
          npm ci --no-audit --no-fund
          npm run seeds:fetch
          npm run db:build
          npm run fonts:fetch
          npm run audio:fetch
          npm run native:sync

      - name: Assemble Android APK
        working-directory: apps/android-native
        run: |
          chmod +x gradlew
          # parity + integrity tamper gates first, then the APK (2026-11 audit)
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/sadaqa-jaria-${{ github.ref_name }}-android.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: sadaqa-jaria-*-android.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS unsigned IPA
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install node deps & rebuild offline assets
        run: |
          npm ci --no-audit --no-fund
          npm run seeds:fetch
          npm run db:build
          npm run fonts:fetch
          npm run audio:fetch
          npm run native:sync

      - name: Install XcodeGen & generate project
        working-directory: apps/ios-native
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iOS app & package IPA
        working-directory: apps/ios-native
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SadaqaJaria \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SadaqaJaria.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/SadaqaJaria-${{ github.ref_name }}-unsigned.ipa" Payload)

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: SadaqaJaria-*-unsigned.ipa
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps & rebuild offline assets
        run: |
          npm ci --no-audit --no-fund
          npm run seeds:fetch
          npm run db:build
          npm run fonts:fetch
          npm run audio:fetch

      - name: Install Electron deps & package installer
        working-directory: apps/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --publish never

      - name: Upload Desktop installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}
          path: |
            apps/electron/dist/*.exe
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [test, build-android, build-ios, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release — إنشاء الإصدار فقط (2026-11 audit)
    steps:
      - uses: actions/checkout@v4
        with:
          # عمق كامل: خطوة الملاحظات تحتاج وسوم git للبحث عن وسم الإصدار السابق
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build v2 offline assets & PWA archive
        run: |
          npm ci --no-audit --no-fund
          npm run seeds:fetch
          npm run db:build
          npm run fonts:fetch
          npm run audio:fetch
          npm run pages:build
          mv dist/pages dist/sadaqa-jaria
          cd dist && zip -r "../sadaqa-jaria-${{ github.ref_name }}-web.zip" sadaqa-jaria

      - name: Download native & desktop release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh sadaqa-jaria-*-web.zip release-artifacts/

      - name: Write release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          NOTES="release-notes.md"

          # ملاحظات الإصدار: قسم الوسم الحالي في CHANGELOG.md هو المصدر الوحيد
          # للنص (من سطر '## <tag>' حتى عنوان '## ' التالي). هذا يمنع النص
          # الآلي المبعثر (قوائم PR التابعة لـ dependabot) الذي كان يُنشر سابقًا.
          awk -v tag="$TAG" '
            $1 == "##" && $2 == tag { found = 1; next }
            found && $1 == "##" { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"

          if [ ! -s "$NOTES" ]; then
            echo "::warning::CHANGELOG.md has no '## ${TAG}' section — publishing a minimal fallback body"
            printf 'Release %s.\n' "$TAG" > "$NOTES"
          fi

          web_zip=$(find . -maxdepth 1 -type f -name 'sadaqa-jaria-*-web.zip' -print -quit)

          link_of() { printf '[`%s`](%s/releases/download/%s/%s)' "$1" "$REPO_URL" "$TAG" "$1"; }

          # قائمة التنزيلات تُبنى من الملفات المرفوعة فعلًا لا من قوالب —
          # حتى لا يوثّق رابط لملف غير موجود (audit 2026-11: أسماء سطح المكتب
          # تأتي من إصدار electron وليس من الوسم، فالبناء الديناميكي وحده صحيح)
          {
            printf '\n## Downloads\n\n'
            if [ -n "$web_zip" ]; then printf -- '- **Web (PWA):** %s\n' "$(link_of "$(basename "$web_zip")")"; fi
            for f in release-artifacts/*.ipa release-artifacts/*.apk release-artifacts/*.exe release-artifacts/*.dmg release-artifacts/*.zip release-artifacts/*.AppImage release-artifacts/*.deb; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              case "$name" in
                *.ipa)
                  ipa_enc=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$REPO_URL/releases/download/$TAG/$name")
                  printf -- '- **iOS (iPhone / iPad):** %s — unsigned; [one-tap on-device install via SideInstaller](https://sideinstaller.net/open.html?url=%s) (see the README iOS guide)\n' "$(link_of "$name")" "$ipa_enc"
                  ;;
                *.apk) printf -- '- **Android:** %s\n' "$(link_of "$name")" ;;
                *.exe) printf -- '- **Windows:** %s\n' "$(link_of "$name")" ;;
                *.dmg) printf -- '- **macOS (Apple Silicon):** %s\n' "$(link_of "$name")" ;;
                *.zip) printf -- '- **macOS (Apple Silicon) portable:** %s\n' "$(link_of "$name")" ;;
                *.AppImage) printf -- '- **Linux:** %s\n' "$(link_of "$name")" ;;
                *.deb) printf -- '- **Linux (.deb):** %s\n' "$(link_of "$name")" ;;
              esac
            done
          } >> "$NOTES"

          # رابط Full Changelog إلى الوسم السابق — يُتخطى في أول إصدار
          prev_tag=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            printf '\n**Full Changelog:** %s/compare/%s...%s\n' "$REPO_URL" "$prev_tag" "$TAG" >> "$NOTES"
          fi

          echo '---- release notes preview ----'
          cat "$NOTES"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sadaqa-jaria-*-web.zip
            release-artifacts/*
          body_path: release-notes.md
          generate_release_notes: false
