name: Deploy v2 PWA to GitHub Pages

# النشر ليس إلا بعد نجاح CI الكامل على main — كان يُنشر بالتوازي مع الاختبارات
# فتصل تعديلة مكسورة للإنتاج قبل اختبارها (audit 2026-11)
on:
  workflow_run:
    workflows: ["CI & Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build v2 Golden Reference PWA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & build offline assets
        run: |
          npm install --no-audit --no-fund
          npm run seeds:fetch
          npm run db:build
          npm run fonts:fetch
          npm run audio:fetch

      - name: Stage GitHub Pages artifact
        run: npm run pages:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
