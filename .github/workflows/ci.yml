name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Test (PWA E2E + Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Chrome for CDP tests
        run: |
          # chromium-browser على ubuntu-24.04 هو غلاف snap لا يعمل داخل العدّاءات — ثبّت Chrome الحقيقي
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get -f install -y
          echo "E2E_BROWSER=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          /usr/bin/google-chrome --version

      - name: Run unit + E2E suite
        env:
          E2E_BROWSER: ${{ env.E2E_BROWSER }}
        run: |
          # شغّل الخادم ثم الحزمة كاملة
          node tests/run-server.mjs 8123 &
          sleep 1
          npm test

      - name: v2 engine + parity checks
        run: |
          npm run test:core
          npm run parity:verify

  release:
    name: Publish Web/PWA release archive
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean PWA archive
        run: |
          mkdir -p dist/sadaqa-jaria
          cp -r index.html manifest.json sw.js robots.txt sitemap.xml icons assets css js .nojekyll dist/sadaqa-jaria/
          cd dist && zip -r "../sadaqa-jaria-${{ github.ref_name }}-web.zip" sadaqa-jaria

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sadaqa-jaria-*-web.zip
          generate_release_notes: true
