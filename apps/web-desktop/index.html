<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF7F0">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07110F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>إسلامي — المصحف والأذكار والمواقيت</title>
  <link rel="icon" href="../../icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/mushaf.css">
  <link rel="stylesheet" href="styles/sheets.css">
  <link rel="stylesheet" href="styles/tools.css">
</head>
<body data-theme="dark">
  <div id="screen-root" aria-live="polite"></div>

  <!-- Liquid Glass control layer: unified 4-tab bottom dock (mobile) that
       becomes a full-height right rail on desktop (>=1024px) — brand mark at
       top, tabs + search, collapse for distraction-free reading. -->
  <div class="glass-dock" id="glass-dock">
    <nav class="glass-tabbar" id="tabbar" aria-label="التنقل الرئيسي">
      <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
      <div class="rail-brand" id="rail-brand" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3H11v17H4.5A2.5 2.5 0 0 0 2 22V5.5Z"/><path d="M22 5.5A2.5 2.5 0 0 0 19.5 3H13v17h6.5a2.5 2.5 0 0 1 2.5 2V5.5Z"/><path d="M12 3v17"/></svg>
      </div>
      <button class="tab-btn" type="button" data-tab="today">
        <span class="tab-ico" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </span>
        <span class="tab-lbl">اليوم</span>
      </button>
      <button class="tab-btn" type="button" data-tab="mushaf">
        <span class="tab-ico" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3H11v17H4.5A2.5 2.5 0 0 0 2 22V5.5Z"/><path d="M22 5.5A2.5 2.5 0 0 0 19.5 3H13v17h6.5a2.5 2.5 0 0 1 2.5 2V5.5Z"/></svg>
        </span>
        <span class="tab-lbl">المصحف</span>
      </button>
      <button class="tab-btn" type="button" data-tab="athkar">
        <span class="tab-ico" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2.2 3.2-5 5.4-5 9a5 5 0 0 0 10 0c0-3.6-2.8-5.8-5-9Z"/><path d="M12 12v5"/><path d="M8 20h8"/></svg>
        </span>
        <span class="tab-lbl">الأذكار</span>
      </button>
      <button class="tab-btn" type="button" data-tab="tools">
        <span class="tab-ico" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </span>
        <span class="tab-lbl">الأدوات</span>
      </button>
      <button class="tab-btn" type="button" id="rail-search" aria-label="بحث شامل" title="بحث في القرآن والأذكار">
        <span class="tab-ico" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>
        </span>
        <span class="tab-lbl">بحث</span>
      </button>
      <button class="rail-collapse" type="button" id="rail-collapse" aria-label="وضع القراءة المركّز" title="إخفاء الشريط">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </nav>
  </div>

  <button class="rail-restore" type="button" id="rail-restore" aria-label="إظهار شريط التنقل" hidden>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>

  <!-- شريط قسم المصحف الطافي (قراءتي · الفهرس · ختمتي · التلاوة): يظهر فوق
       الـdock فقط في شاشات قسم المصحف الخارجة عن القارئ نفسه — سهولة وصول
       بيد واحدة بدل الشريط العلوي البعيد. -->
  <div class="mushaf-hub-dock" id="mushaf-hub-dock" role="navigation" aria-label="أقسام المصحف" hidden>
    <button type="button" data-go="mushaf-page" aria-label="قراءتي"><span class="hub-ico" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3H11v17H4.5A2.5 2.5 0 0 0 2 22V5.5Z"/><path d="M22 5.5A2.5 2.5 0 0 0 19.5 3H13v17h6.5a2.5 2.5 0 0 1 2.5 2V5.5Z"/></svg></span><span>قراءتي</span></button>
    <button type="button" data-go="mushaf-surah-index" aria-label="الفهرس"><span class="hub-ico" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg></span><span>الفهرس</span></button>
    <button type="button" data-go="mushaf-khatmah" aria-label="ختمتي"><span class="hub-ico" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.6A8 8 0 1 1 11.4 4a6.4 6.4 0 0 0 8.6 8.6z"/></svg></span><span>ختمتي</span></button>
    <button type="button" data-go="mushaf-audio" aria-label="التلاوة"><span class="hub-ico" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></span><span>التلاوة</span></button>
  </div>

  <div class="miniplayer" id="miniplayer" role="region" aria-label="مشغل التلاوة"></div>

  <div id="sheet-root"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
