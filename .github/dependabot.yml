# Dependabot — real ecosystems in this repo only.
# SwiftPM (apps/ios-native) has no Dependabot ecosystem — updates are reviewed manually.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/apps/electron"
    schedule:
      interval: "monthly"

  - package-ecosystem: "gradle"
    directory: "/apps/android-native"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
